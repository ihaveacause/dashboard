<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Have a Cause — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080a0f;
  --surface: #0f1218;
  --surface2: #161b24;
  --surface3: #1c2230;
  --border: #1e2535;
  --border2: #252d40;
  --text: #dde3f0;
  --muted: #5a6480;
  --muted2: #8892aa;
  --accent: #e8412a;
  --accent2: #ff6b4a;
  --tamil: #f59e0b;
  --tamil-dim: rgba(245,158,11,0.12);
  --english: #3b82f6;
  --english-dim: rgba(59,130,246,0.12);
  --green: #10b981;
  --green-dim: rgba(16,185,129,0.12);
  --purple: #8b5cf6;
  --purple-dim: rgba(139,92,246,0.12);
  --teal: #14b8a6;
  --teal-dim: rgba(20,184,166,0.12);
  --red: #ef4444;
  --red-dim: rgba(239,68,68,0.12);
  --yellow: #f59e0b;
  --yellow-dim: rgba(245,158,11,0.12);
  --orange: #f97316;
  --orange-dim: rgba(249,115,22,0.12);
  --blue: #3b82f6;
  --blue-dim: rgba(59,130,246,0.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Topbar ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  height: 58px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 200;
  gap: 16px;
}

.logo {
  font-family: 'Syne', sans-serif;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -0.3px;
  white-space: nowrap;
}
.logo em { color: var(--accent); font-style: normal; }

/* ── Language Toggle ── */
.lang-toggle {
  display: flex;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 3px;
  gap: 3px;
}
.lang-btn {
  padding: 6px 18px;
  border-radius: 7px;
  border: none;
  background: transparent;
  color: var(--muted2);
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.lang-btn.active-ta {
  background: var(--tamil-dim);
  color: var(--tamil);
  border: 1px solid rgba(245,158,11,0.25);
}
.lang-btn.active-en {
  background: var(--english-dim);
  color: var(--english);
  border: 1px solid rgba(59,130,246,0.25);
}

/* ── Stats Bar ── */
.stats-bar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.stat-chip {
  padding: 4px 12px;
  border-radius: 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid transparent;
  white-space: nowrap;
}
.stat-chip:hover { opacity: 0.8; }

/* ── Generate All Button ── */
.btn-gen-all {
  padding: 8px 18px;
  background: var(--accent);
  border: none;
  border-radius: 8px;
  color: white;
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.btn-gen-all:hover { background: var(--accent2); transform: translateY(-1px); }
.btn-gen-all:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* ── Filter Bar ── */
.filter-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  position: sticky;
  top: 58px;
  z-index: 199;
}
.filter-row {
  display: flex;
  gap: 4px;
  padding: 10px 0;
  overflow-x: auto;
  scrollbar-width: none;
  align-items: center;
}
.filter-row::-webkit-scrollbar { display: none; }
.filter-btn {
  padding: 5px 14px;
  border-radius: 7px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.filter-btn:hover { color: var(--text); border-color: var(--border2); }
.filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
.filter-divider { width: 1px; height: 20px; background: var(--border2); margin: 0 8px; flex-shrink: 0; }

.module-sel, .pillar-sel {
  padding: 5px 12px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 7px;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  cursor: pointer;
  outline: none;
  margin-left: 4px;
}

/* ── Main Content ── */
.main {
  padding: 24px 28px;
  max-width: 1120px;
  margin: 0 auto;
}

.bucket-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 20px 0 10px;
}
.bucket-label:first-child { padding-top: 0; }

.episodes-grid {
  display: grid;
  gap: 12px;
}

/* ── Episode Card ── */
.ep-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  transition: border-color 0.2s, transform 0.15s;
}
.ep-card:hover { border-color: var(--border2); transform: translateY(-1px); }

.ep-card.st-pending       { border-left: 3px solid var(--muted); }
.ep-card.st-generating    { border-left: 3px solid var(--orange); }
.ep-card.st-script_ready  { border-left: 3px solid var(--blue); }
.ep-card.st-script_approved { border-left: 3px solid var(--yellow); }
.ep-card.st-images_ready  { border-left: 3px solid var(--purple); }
.ep-card.st-images_approved { border-left: 3px solid var(--purple); }
.ep-card.st-infographic_ready { border-left: 3px solid var(--teal); }
.ep-card.st-infographic_approved { border-left: 3px solid var(--teal); }
.ep-card.st-video_ready   { border-left: 3px solid var(--green); }
.ep-card.st-video_approved { border-left: 3px solid var(--green); }
.ep-card.st-published     { border-left: 3px solid var(--accent); opacity: 0.85; }

.ep-header {
  padding: 16px 18px 14px;
  display: flex;
  align-items: flex-start;
  gap: 14px;
}

.ep-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 3px 8px;
  flex-shrink: 0;
  margin-top: 2px;
}

.ep-body { flex: 1; min-width: 0; }

.ep-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.module-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  font-weight: 500;
  padding: 2px 7px;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.mod-1 { background: rgba(245,158,11,0.1); color: #f59e0b; }
.mod-2 { background: rgba(139,92,246,0.1); color: #8b5cf6; }
.mod-3 { background: rgba(59,130,246,0.1); color: #3b82f6; }
.mod-4 { background: rgba(239,68,68,0.1); color: #ef4444; }
.mod-5 { background: rgba(16,185,129,0.1); color: #10b981; }
.mod-6 { background: rgba(20,184,166,0.1); color: #14b8a6; }

.pillar-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--surface2);
  color: var(--muted2);
}

.status-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-left: auto;
}
.sb-pending           { background: rgba(90,100,128,0.15); color: var(--muted2); }
.sb-generating        { background: var(--orange-dim); color: var(--orange); }
.sb-script_ready      { background: var(--blue-dim); color: var(--blue); }
.sb-script_approved   { background: var(--yellow-dim); color: var(--yellow); }
.sb-images_ready      { background: var(--purple-dim); color: var(--purple); }
.sb-images_approved   { background: var(--purple-dim); color: var(--purple); }
.sb-infographic_ready { background: var(--teal-dim); color: var(--teal); }
.sb-infographic_approved { background: var(--teal-dim); color: var(--teal); }
.sb-video_ready       { background: var(--green-dim); color: var(--green); }
.sb-video_approved    { background: var(--green-dim); color: var(--green); }
.sb-published         { background: rgba(232,65,42,0.12); color: var(--accent2); }
.sb-waiting_for_tamil { background: var(--yellow-dim); color: var(--yellow); }

.ep-title-ta {
  font-family: 'Syne', sans-serif;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.5;
  color: var(--text);
  margin-bottom: 3px;
}
.ep-title-en {
  font-size: 12px;
  color: var(--muted2);
  line-height: 1.4;
  margin-bottom: 6px;
}
.ep-bridge {
  font-size: 11px;
  color: var(--muted);
  font-style: italic;
  line-height: 1.4;
}

/* ── Card Actions ── */
.ep-actions {
  padding: 12px 18px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.btn {
  padding: 7px 16px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.2s;
}
.btn:hover { opacity: 0.85; transform: translateY(-1px); }
.btn:active { transform: translateY(0); }

.btn-generate  { background: var(--accent); color: white; border-color: var(--accent); }
.btn-review    { background: var(--blue-dim); color: var(--blue); border-color: rgba(59,130,246,0.3); }
.btn-approve   { background: var(--green-dim); color: var(--green); border-color: rgba(16,185,129,0.3); }
.btn-regen     { background: var(--surface2); color: var(--muted2); border-color: var(--border2); }
.btn-preview   { background: var(--teal-dim); color: var(--teal); border-color: rgba(20,184,166,0.3); }
.btn-youtube   { background: var(--red-dim); color: var(--red); border-color: rgba(239,68,68,0.3); }
.btn-disabled  { background: var(--surface2); color: var(--muted); border-color: var(--border); cursor: not-allowed; opacity: 0.5; }

.generating-banner {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--orange);
  font-family: 'JetBrains Mono', monospace;
}
.spin { display: inline-block; animation: spin 1.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.waiting-banner {
  font-size: 12px;
  color: var(--muted2);
  font-family: 'JetBrains Mono', monospace;
}

/* ── Full Screen Script Modal ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(4px);
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 18px;
  width: 100%;
  max-width: 860px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: modalIn 0.25s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(20px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.modal-header {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.modal-ep-info { flex: 1; }
.modal-ep-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 4px;
}
.modal-title {
  font-family: 'Syne', sans-serif;
  font-size: 17px;
  font-weight: 700;
  line-height: 1.4;
}
.modal-subtitle {
  font-size: 12px;
  color: var(--muted2);
  margin-top: 3px;
}
.modal-close {
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  color: var(--muted2);
  width: 32px;
  height: 32px;
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
}
.modal-close:hover { color: var(--text); border-color: var(--border); }

.modal-lang-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
}
.modal-lang-tab {
  padding: 10px 18px;
  font-size: 13px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  color: var(--muted);
  border: none;
  border-bottom: 2px solid transparent;
  background: none;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: -1px;
}
.modal-lang-tab:hover { color: var(--text); }
.modal-lang-tab.active-ta { color: var(--tamil); border-bottom-color: var(--tamil); }
.modal-lang-tab.active-en { color: var(--english); border-bottom-color: var(--english); }

.modal-body {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  scrollbar-width: thin;
  scrollbar-color: var(--border2) transparent;
}

.script-text {
  font-size: 14px;
  line-height: 1.8;
  color: var(--text);
  white-space: pre-wrap;
  font-family: 'Inter', sans-serif;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
}
.script-empty {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  padding: 40px;
  font-family: 'JetBrains Mono', monospace;
}

/* Regenerate section */
.regen-section {
  margin-top: 16px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  display: none;
}
.regen-section.open { display: block; }
.regen-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted2);
  margin-bottom: 8px;
  font-family: 'JetBrains Mono', monospace;
}
.regen-textarea {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 8px;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  padding: 10px 12px;
  resize: vertical;
  min-height: 80px;
  outline: none;
  transition: border-color 0.2s;
}
.regen-textarea:focus { border-color: var(--accent); }
.regen-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.save-pref-q {
  font-size: 12px;
  color: var(--muted2);
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
}
.save-pref-q input { accent-color: var(--accent); cursor: pointer; }

.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.modal-status-note {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  margin-left: auto;
}

/* ── Notification Toast ── */
.toast {
  position: fixed;
  bottom: 28px;
  right: 28px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 12px 18px;
  font-size: 13px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text);
  z-index: 9999;
  transform: translateY(80px);
  opacity: 0;
  transition: all 0.3s;
  max-width: 340px;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { border-color: rgba(16,185,129,0.4); color: var(--green); }
.toast.error   { border-color: rgba(239,68,68,0.4); color: var(--red); }
.toast.info    { border-color: rgba(59,130,246,0.4); color: var(--blue); }

/* ── Empty State ── */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; font-family: 'JetBrains Mono', monospace; }

/* ── Loading ── */
.loading-bar {
  height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent));
  background-size: 200% 100%;
  animation: loadbar 1.2s ease infinite;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 9999;
  display: none;
}
.loading-bar.show { display: block; }
@keyframes loadbar { 0%{background-position:100% 0} 100%{background-position:-100% 0} }

/* Progress bar for generate all */
.gen-all-progress {
  display: none;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 12px 18px;
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--muted2);
  margin: 16px 0 0;
}
.gen-all-progress.show { display: block; }
.gen-progress-bar {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin-top: 8px;
  overflow: hidden;
}
.gen-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 2px;
  transition: width 0.4s ease;
  width: 0%;
}
</style>
</head>
<body>

<div class="loading-bar" id="loadbar"></div>

<!-- ── Topbar ── -->
<div class="topbar">
  <div class="logo">I Have A <em>Cause</em></div>

  <div class="lang-toggle">
    <button class="lang-btn active-ta" id="btn-ta" onclick="setLang('ta')">🇮🇳 Tamil</button>
    <button class="lang-btn" id="btn-en" onclick="setLang('en')">🇬🇧 English</button>
  </div>

  <div class="stats-bar" id="stats-bar">
    <span class="stat-chip" style="background:rgba(90,100,128,0.12);color:var(--muted2);" onclick="setFilter('all')">⏳ — pending</span>
    <span class="stat-chip" style="background:var(--blue-dim);color:var(--blue);" onclick="setFilter('script_ready')">📄 — script ready</span>
    <span class="stat-chip" style="background:var(--yellow-dim);color:var(--yellow);" onclick="setFilter('script_approved')">✅ — approved</span>
    <span class="stat-chip" style="background:var(--green-dim);color:var(--green);" onclick="setFilter('video_ready')">🎥 — video ready</span>
    <span class="stat-chip" style="background:rgba(232,65,42,0.12);color:var(--accent2);" onclick="setFilter('published')">🚀 — published</span>
  </div>

  <button class="btn-gen-all" id="btn-gen-all" onclick="generateAll()">⚡ Generate All Pending</button>
</div>

<!-- ── Filter Bar ── -->
<div class="filter-bar">
  <div class="filter-row" id="filter-row">
    <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" onclick="setFilter('pending',this)">Pending</button>
    <button class="filter-btn" onclick="setFilter('generating',this)">Generating</button>
    <button class="filter-btn" onclick="setFilter('script_ready',this)">Script Ready</button>
    <button class="filter-btn" onclick="setFilter('script_approved',this)">Script Approved</button>
    <button class="filter-btn" onclick="setFilter('images_ready',this)">Images Ready</button>
    <button class="filter-btn" onclick="setFilter('images_approved',this)">Images Approved</button>
    <button class="filter-btn" onclick="setFilter('video_ready',this)">Video Ready</button>
    <button class="filter-btn" onclick="setFilter('published',this)">Published</button>
    <div class="filter-divider"></div>
    <select class="module-sel" id="module-sel" onchange="render()">
      <option value="all">All Modules</option>
      <option value="Module 1: The 4 States">Module 1</option>
      <option value="Module 2: Advaita Vedanta">Module 2</option>
      <option value="Module 3: Modern Science">Module 3</option>
      <option value="Module 4: Social Reform">Module 4</option>
      <option value="Module 5: Animal Consciousness">Module 5</option>
      <option value="Module 6: Practical Life">Module 6</option>
    </select>
    <select class="pillar-sel" id="pillar-sel" onchange="render()">
      <option value="all">All Pillars</option>
      <option value="Wisdom">Wisdom</option>
      <option value="Social">Social</option>
      <option value="Compassion">Compassion</option>
      <option value="Daily">Daily</option>

<div class="main" id="main">

<!-- ── Script Review Modal ── -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">

            <button class="btn btn-generate" onclick="submitRegen('en')">⚡ Regenerate English</button>
            <button class="btn btn-regen" onclick="toggleRegen('en')">Cancel</button>

              <input type="checkbox" id="save-pref-en"> Save as permanent preference?
            </label>

      <button class="btn btn-approve" id="modal-approve-btn" onclick="approveScript()">✓ Approve Script</button>

    </div>
  </div>
</div>

<!-- ── Toast ── -->
<div class="toast" id="toast"></div>

<script>
// ── Config ──────────────────────────────────────────────────
const SB_URL = 'https://alfuvzlmatfkgdrkeqgk.supabase.co';
const SB_KEY = 'sb_publishable_W6dVLZyqGI60qF6nDchJWg_kv2ZFfhn';
const EDGE_FN       = `${SB_URL}/functions/v1/trigger-script-gen`;
const EDGE_IMG_FN   = `${SB_URL}/functions/v1/trigger-image-gen`;
const EDGE_VIDEO_FN = `${SB_URL}/functions/v1/trigger-video-gen`;
const EDGE_SVG_FN   = `${SB_URL}/functions/v1/trigger-svg-gen`;

const H = {
  'apikey': SB_KEY,
  'Authorization': `Bearer ${SB_KEY}`,
  'Content-Type': 'application/json'
};

// ── State ────────────────────────────────────────────────────
let lang        = 'ta';   // 'ta' | 'en'
let filter      = 'all';
let episodes    = [];
let modalEp     = null;
let modalLang   = 'ta';

const TABLE = () => lang === 'ta' ? 'tamil_episodes' : 'english_episodes';

// ── Status config ────────────────────────────────────────────
const STATUS_LABELS = {
  pending:              'Pending',
  generating:           'Generating',
  script_ready:         'Script Ready',
  script_approved:      'Script Approved',
  images_ready:         'Images Ready',
  images_approved:      'Images Approved',
  infographic_ready:    'Infographic Ready',
  infographic_approved: 'Infographic Approved',
  video_ready:          'Video Ready',
  video_approved:       'Video Approved',
  waiting_for_tamil:    'Waiting Tamil',
  published:            'Published',
};

const MODULE_NUM = m => {
  const n = m.match(/Module (\d)/);
  return n ? parseInt(n[1]) : 1;
};

// ── Load ─────────────────────────────────────────────────────
async function load() {
  showLoader(true);
  try {
    const r = await fetch(`${SB_URL}/rest/v1/${TABLE()}?select=*&order=episode_number.asc&limit=200`, { headers: H });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    episodes = await r.json();
    updateStats();
    render();
  } catch(e) {
    document.getElementById('main').innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><p>Error loading episodes: ${e.message}</p></div>`;
  }
  showLoader(false);
}

// ── Stats ────────────────────────────────────────────────────
function updateStats() {
  const chips = document.querySelectorAll('.stat-chip');
  const counts = {
    pending: episodes.filter(e => e.status === 'pending').length,
    script_ready: episodes.filter(e => e.status === 'script_ready').length,
    script_approved: episodes.filter(e => e.status === 'script_approved').length,
    video_ready: episodes.filter(e => e.status === 'video_ready').length,
    published: episodes.filter(e => e.status === 'published').length,
  };
  chips[0].textContent = `⏳ ${counts.pending} pending`;
  chips[1].textContent = `📄 ${counts.script_ready} script ready`;
  chips[2].textContent = `✅ ${counts.script_approved} approved`;
  chips[3].textContent = `🎥 ${counts.video_ready} video ready`;
  chips[4].textContent = `🚀 ${counts.published} published`;
}

// ── Render ───────────────────────────────────────────────────
function render() {
  const moduleSel = document.getElementById('module-sel').value;
  const pillarSel = document.getElementById('pillar-sel').value;

  let filtered = episodes.filter(ep => {
    const statusMatch = filter === 'all' || ep.status === filter;
    const moduleMatch = moduleSel === 'all' || ep.module === moduleSel;
    const pillarMatch = pillarSel === 'all' || ep.pillar === pillarSel;
    return statusMatch && moduleMatch && pillarMatch;
  });

  if (!filtered.length) {
    document.getElementById('main').innerHTML = `<div class="empty-state"><div class="empty-icon">✨</div><p>No episodes in this view</p></div>`;
    return;
  }

  // Group by status for bucket view if showing all
  let html = '';
  if (filter === 'all') {
    const ORDER = ['generating','script_ready','script_approved','images_ready','images_approved','infographic_ready','infographic_approved','video_ready','video_approved','published','pending'];
    const groups = {};
    filtered.forEach(ep => {
      const s = ep.status || 'pending';
      if (!groups[s]) groups[s] = [];
      groups[s].push(ep);
    });
    ORDER.forEach(s => {
      if (groups[s] && groups[s].length) {
        const label = STATUS_LABELS[s] || s;
        const count = groups[s].length;
        html += `<div class="bucket-label">${label} · ${count} episode${count>1?'s':''}</div>`;
        html += `<div class="episodes-grid">${groups[s].map(buildCard).join('')}</div>`;
      }
    });
  } else {
    html = `<div class="episodes-grid">${filtered.map(buildCard).join('')}</div>`;
  }

  document.getElementById('main').innerHTML = html;
}

// ── Build Card ───────────────────────────────────────────────
function buildCard(ep) {
  const modNum = MODULE_NUM(ep.module);
  const status = ep.status || 'pending';
  const actions = buildActions(ep, status);

  return `
  <div class="ep-card st-${status}" id="card-${ep.episode_number}">
    <div class="ep-header">
      <div class="ep-num">#${String(ep.episode_number).padStart(3,'0')}</div>
      <div class="ep-body">
        <div class="ep-meta">
          <span class="module-badge mod-${modNum}">M${modNum}</span>
          <span class="pillar-badge">${ep.pillar||''}</span>
          <span class="status-badge sb-${status}">${STATUS_LABELS[status]||status}</span>
        </div>
        <div class="ep-title-ta">${ep.title_tamil||''}</div>
        <div class="ep-title-en">${ep.title_english||''}</div>
        ${ep.bridge ? `<div class="ep-bridge">↳ ${ep.bridge}</div>` : ''}
      </div>
    </div>
    <div class="ep-actions">${actions}</div>
  </div>`;
}

// ── Build Actions ────────────────────────────────────────────
function buildActions(ep, status) {
  const n = ep.episode_number;

  if (status === 'pending') {
    return `<button class="btn btn-generate" onclick="generateScript(${n})">⚡ Generate Script</button>`;
  }

  if (status === 'generating') {
    return `<div class="generating-banner"><span class="spin">⚙️</span> Gemini is generating — check back in a few minutes</div>`;
  }

  if (status === 'script_ready') {
    return `
      <button class="btn btn-review" onclick="openModal(${n})">📄 Review Script</button>
      <button class="btn btn-approve" onclick="quickApprove(${n},'script_approved')">✓ Approve Script</button>`;
  }

  if (status === 'script_approved') {
    if (lang === 'ta') {
      return `
        <button class="btn btn-review" onclick="openModal(${n})">📄 View Script</button>
        <button class="btn btn-preview" onclick="generateImages(${n})">🖼 Generate Images</button>`;
    } else {
      return `
        <button class="btn btn-review" onclick="openModal(${n})">📄 View Script</button>
        <div class="waiting-banner">⏳ Waiting for Tamil video to complete</div>`;
    }
  }

  if (status === 'generating_images') {
    return `<div class="generating-banner"><span class="spin">🎨</span> Imagen 3 generating cosmic scenes — check back in ~5 min</div>`;
  }

  if (status === 'images_ready') {
    return `
      <button class="btn btn-review" onclick="openImagesModal(${n})">🖼 Review Images</button>
      <button class="btn btn-approve" onclick="quickApprove(${n},'images_approved')">✓ Approve Images</button>`;
  }

  if (status === 'images_approved') {
    return `
      <button class="btn btn-review" onclick="openImagesModal(${n})">🖼 View Images</button>
      <button class="btn btn-preview" onclick="generateVideo(${n})">🎬 Generate Video</button>`;
  }

  if (status === 'rendering_video') {
    return `<div class="generating-banner"><span class="spin">🎬</span> FFmpeg rendering video — check back in ~15 min</div>`;
  }

  if (status === 'video_ready') {
    return `
      <button class="btn btn-preview" onclick="previewVideo(${n})">▶ Preview Video</button>
      <button class="btn btn-approve" onclick="quickApprove(${n},'video_approved')">✓ Approve for YouTube</button>`;
  }

  if (status === 'video_approved') {
    return `<button class="btn btn-youtube" onclick="uploadYouTube(${n})">▲ Upload to YouTube</button>`;
  }

  if (status === 'published') {
    const url = ep.youtube_url;
    return url
      ? `<a href="${url}" target="_blank" class="btn btn-youtube" style="text-decoration:none;">▶ Watch on YouTube</a>`
      : `<span style="font-size:12px;color:var(--accent2);font-family:'JetBrains Mono',monospace;">🚀 Published</span>`;
  }

  if (status === 'waiting_for_tamil') {
    return `<div class="waiting-banner">⏳ Waiting for Tamil Episode ${n} to be published first</div>`;
  }

  return `<span style="font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;">${STATUS_LABELS[status]||status}</span>`;
}

// ── Language Switch ──────────────────────────────────────────
function setLang(l) {
  lang = l;
  document.getElementById('btn-ta').className = 'lang-btn' + (l==='ta'?' active-ta':'');
  document.getElementById('btn-en').className = 'lang-btn' + (l==='en'?' active-en':'');
  load();
}

// ── Filter ───────────────────────────────────────────────────
function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  render();
}

// ── Generate Script (single) ─────────────────────────────────
async function generateScript(n) {
  const card = document.getElementById(`card-${n}`);
  const btn = card?.querySelector('.btn-generate');
  if (btn) { btn.disabled = true; btn.textContent = '⚙️ Triggering...'; }

  try {
    const r = await fetch(EDGE_FN, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SB_KEY}` },
      body: JSON.stringify({ episode_number: n })
    });
    const data = await r.json();
    if (data.success) {
      await patchEpisode(n, { status: 'generating' });
      showToast(`Episode ${n} queued — Gemini is working`, 'success');
      setTimeout(load, 1500);
    } else {
      throw new Error(data.error || 'Unknown error');
    }
  } catch(e) {
    showToast(`Error: ${e.message}`, 'error');
    if (btn) { btn.disabled = false; btn.textContent = '⚡ Generate Script'; }
  }
}

// ── Generate All Pending ─────────────────────────────────────
async function generateAll() {
  const pending = episodes.filter(e => e.status === 'pending');
  if (!pending.length) { showToast('No pending episodes to generate', 'info'); return; }

  const btn = document.getElementById('btn-gen-all');
  btn.disabled = true;
  btn.textContent = `⚙️ Queueing ${pending.length}...`;

  const prog = document.getElementById('gen-progress');
  const fill = document.getElementById('gen-progress-fill');
  const txt  = document.getElementById('gen-progress-text');
  prog.classList.add('show');

  let done = 0;
  for (const ep of pending) {
    txt.textContent = `Triggering Episode ${ep.episode_number} (${done+1}/${pending.length})...`;
    fill.style.width = `${Math.round((done/pending.length)*100)}%`;
    try {
      await fetch(EDGE_FN, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SB_KEY}` },
        body: JSON.stringify({ episode_number: ep.episode_number })
      });
      await patchEpisode(ep.episode_number, { status: 'generating' });
    } catch(e) { /* continue */ }
    done++;
    await delay(2000); // 2s between each to avoid rate limits
  }

  fill.style.width = '100%';
  txt.textContent = `✅ All ${done} episodes queued!`;
  btn.disabled = false;
  btn.textContent = '⚡ Generate All Pending';
  showToast(`${done} episodes queued for generation`, 'success');
  setTimeout(() => { prog.classList.remove('show'); load(); }, 3000);
}

// ── Quick Approve (without modal) ───────────────────────────
async function quickApprove(n, newStatus) {
  try {
    await patchEpisode(n, { status: newStatus });
    showToast(`Episode ${n} → ${STATUS_LABELS[newStatus]}`, 'success');
    load();
  } catch(e) {
    showToast(`Error: ${e.message}`, 'error');
  }
}

// ── Modal ────────────────────────────────────────────────────
function openModal(n) {
  const ep = episodes.find(e => e.episode_number === n);
  if (!ep) return;
  modalEp = ep;
  modalLang = lang; // start on current language tab

  document.getElementById('modal-ep-num').textContent = `Episode ${n} · ${ep.module}`;
  document.getElementById('modal-title').textContent = ep.title_tamil;
  document.getElementById('modal-subtitle').textContent = ep.title_english;

  // Reset any image modal customisations
  document.getElementById('modal-lang-tabs').style.display = '';
  document.getElementById('script-content-ta').style.whiteSpace = '';
  document.getElementById('script-content-ta').style.background = '';
  document.getElementById('script-content-ta').style.border = '';
  document.getElementById('script-content-ta').style.padding = '';
  document.getElementById('modal-regen-btn').style.display = '';
  document.getElementById('modal-approve-btn').onclick = approveScript;

  const tScript = ep.script_tamil || ep.script_english || '';
  const eScript = ep.script_english || '';

  document.getElementById('script-content-ta').textContent = tScript || '— Script not generated yet —';
  if (!tScript) document.getElementById('script-content-ta').className = 'script-empty';
  else document.getElementById('script-content-ta').className = 'script-text';

  document.getElementById('script-content-en').textContent = eScript || '— English script not generated yet —';
  if (!eScript) document.getElementById('script-content-en').className = 'script-empty';
  else document.getElementById('script-content-en').className = 'script-text';

  // Reset regen panels
  document.getElementById('regen-ta').classList.remove('open');
  document.getElementById('regen-en').classList.remove('open');
  document.getElementById('regen-note-ta').value = '';
  document.getElementById('regen-note-en').value = '';
  document.getElementById('save-pref-ta').checked = false;
  document.getElementById('save-pref-en').checked = false;

  // Status note
  const s = ep.status || 'pending';
  document.getElementById('modal-status-note').textContent = `status: ${STATUS_LABELS[s]||s}`;

  // Approve button label
  document.getElementById('modal-approve-btn').textContent =
    s === 'script_ready' ? '✓ Approve Script' : '✓ Approved ✅';
  document.getElementById('modal-approve-btn').disabled = s === 'script_approved';

  switchModalLang(lang);
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function switchModalLang(l) {
  modalLang = l;
  document.getElementById('modal-script-ta').style.display = l==='ta' ? 'block' : 'none';
  document.getElementById('modal-script-en').style.display = l==='en' ? 'block' : 'none';
  document.getElementById('mtab-ta').className = 'modal-lang-tab' + (l==='ta' ? ' active-ta' : '');
  document.getElementById('mtab-en').className = 'modal-lang-tab' + (l==='en' ? ' active-en' : '');

  // In English mode, hide approve (handled separately), show only regen
  if (l === 'en' && lang === 'ta') {
    document.getElementById('modal-approve-btn').style.display = 'none';
  } else {
    document.getElementById('modal-approve-btn').style.display = '';
  }
}

function closeModal(event) {
  if (event && event.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
  modalEp = null;
}

function openRegen() {
  const panel = document.getElementById(`regen-${modalLang}`);
  panel.classList.toggle('open');
}
function toggleRegen(l) {
  document.getElementById(`regen-${l}`).classList.remove('open');
}

async function approveScript() {
  if (!modalEp) return;
  const n = modalEp.episode_number;
  const table = TABLE();
  try {
    await patchTable(table, n, { status: 'script_approved', script_approved_at: new Date().toISOString() });
    // Also approve English table if we're in Tamil mode (English script was generated together)
    if (lang === 'ta') {
      await patchTable('english_episodes', n, { status: 'script_ready' });
    }
    showToast(`Episode ${n} script approved ✓`, 'success');
    closeModal();
    load();
  } catch(e) {
    showToast(`Error: ${e.message}`, 'error');
  }
}

async function submitRegen(l) {
  if (!modalEp) return;
  const n = modalEp.episode_number;
  const note = document.getElementById(`regen-note-${l}`).value.trim();
  if (!note) { showToast('Please enter a regeneration note', 'error'); return; }

  const savePref = document.getElementById(`save-pref-${l}`).checked;

  try {
    // Save preference if requested
    if (savePref) {
      const cat = detectPrefCategory(note);
      await fetch(`${SB_URL}/rest/v1/channel_preferences`, {
        method: 'POST',
        headers: H,
        body: JSON.stringify({ category: cat, preference: note, episode_number: n, is_active: true })
      });
      showToast(`Preference saved: [${cat}]`, 'info');
    }

    // Save regen note and reset status to pending
    const table = l === 'ta' ? 'tamil_episodes' : 'english_episodes';
    await patchTable(table, n, {
      regenerate_note: note,
      status: 'pending',
      script_tamil: null,
      script_english: null
    });

    // Trigger regeneration
    await fetch(EDGE_FN, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SB_KEY}` },
      body: JSON.stringify({ episode_number: n })
    });

    await patchTable(table, n, { status: 'generating' });
    showToast(`Episode ${n} queued for regeneration`, 'success');
    closeModal();
    load();
  } catch(e) {
    showToast(`Error: ${e.message}`, 'error');
  }
}

function detectPrefCategory(note) {
  const n = note.toLowerCase();
  if (/image|visual|photo|scene|colour|color|style/.test(n)) return 'image';
  if (/voice|audio|tone|speed|pace|narrat/.test(n)) return 'voice';
  if (/infograph|svg|diagram|chart/.test(n)) return 'infographic';
  return 'script';
}

// ── Generate Images ──────────────────────────────────────────
async function generateImages(n) {
  try {
    await patchEpisode(n, { status: 'generating_images' });
    const r = await fetch(EDGE_IMG_FN, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SB_KEY}` },
      body: JSON.stringify({ episode_number: n })
    });
    const data = await r.json();
    if (data.success) {
      showToast(`Episode ${n} — Imagen 3 generating cosmic scenes`, 'success');
      setTimeout(load, 2000);
    } else throw new Error(data.error || 'Unknown error');
  } catch(e) {
    showToast(`Error: ${e.message}`, 'error');
    await patchEpisode(n, { status: 'script_approved' });
  }
}

// ── Generate Video ───────────────────────────────────────────
async function generateVideo(n) {
  try {
    await patchEpisode(n, { status: 'rendering_video' });
    const r = await fetch(EDGE_VIDEO_FN, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SB_KEY}` },
      body: JSON.stringify({ episode_number: n })
    });
    const data = await r.json();
    if (data.success) {
      showToast(`Episode ${n} — FFmpeg assembling video`, 'success');
      setTimeout(load, 2000);
    } else throw new Error(data.error || 'Unknown error');
  } catch(e) {
    showToast(`Error: ${e.message}`, 'error');
    await patchEpisode(n, { status: 'images_approved' });
  }
}

// ── Images Review Modal ──────────────────────────────────────
function openImagesModal(n) {
  const ep = episodes.find(e => e.episode_number === n);
  if (!ep) return;

  let imageData = [];
  try {
    imageData = typeof ep.image_urls === 'string'
      ? JSON.parse(ep.image_urls)
      : (ep.image_urls || []);
  } catch(e) { imageData = []; }

  let svgData = null;
  try {
    svgData = typeof ep.infographic_svg === 'string'
      ? JSON.parse(ep.infographic_svg)
      : ep.infographic_svg;
  } catch(e) {}

  const imgHtml = imageData.map((img, i) => `
    <div style="margin-bottom:24px;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;overflow:hidden;">
      <div style="padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);">
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);">Scene ${img.id}</span>
        <span style="font-size:12px;font-weight:600;color:var(--text);">${img.label}</span>
        <button onclick="regenSingleImage(${n},${img.id},'${img.label}')"
          style="margin-left:auto;padding:4px 12px;border-radius:6px;border:1px solid var(--border2);
          background:var(--surface);color:var(--muted2);font-size:11px;cursor:pointer;">
          ↺ Regenerate
        </button>
      </div>
      <img src="${img.url}" style="width:100%;display:block;" loading="lazy"/>
      <div id="regen-note-img-${img.id}" style="display:none;padding:12px;border-top:1px solid var(--border);">
        <textarea id="regen-txt-img-${img.id}" placeholder="Describe what to change... e.g. more cosmic, less realistic"
          style="width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:8px;
          color:var(--text);font-family:inherit;font-size:12px;padding:8px;resize:vertical;min-height:60px;outline:none;"></textarea>
        <div style="display:flex;gap:8px;margin-top:8px;align-items:center;">
          <button onclick="submitSingleRegen(${n},${img.id})"
            style="padding:6px 14px;border-radius:6px;background:var(--accent);border:none;color:white;font-size:12px;cursor:pointer;">
            ⚡ Regenerate Scene ${img.id}
          </button>
          <button onclick="document.getElementById('regen-note-img-${img.id}').style.display='none'"
            style="padding:6px 14px;border-radius:6px;background:var(--surface2);border:1px solid var(--border2);color:var(--muted2);font-size:12px;cursor:pointer;">
            Cancel
          </button>
          <label style="margin-left:auto;font-size:11px;color:var(--muted2);display:flex;align-items:center;gap:5px;">
            <input type="checkbox" id="save-pref-img-${img.id}" style="accent-color:var(--accent);"> Save as preference?
          </label>
        </div>
      </div>
    </div>
  `).join('');

  const svgHtml = svgData ? `
    <div style="margin-bottom:24px;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;overflow:hidden;">
      <div style="padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);">
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);">Infographic</span>
        <span style="font-size:12px;font-weight:600;color:var(--text);">4 States of Consciousness — SVG Diagram</span>
        <button onclick="regenInfographic(${n})"
          style="margin-left:auto;padding:4px 12px;border-radius:6px;border:1px solid var(--border2);
          background:var(--surface);color:var(--muted2);font-size:11px;cursor:pointer;">
          ↺ Regenerate
        </button>
      </div>
      ${svgData.url
        ? `<img src="${svgData.url}" style="width:100%;display:block;" loading="lazy"
             onerror="this.style.display='none';this.nextElementSibling.style.display='block'"/>
           <div style="display:none;padding:20px;text-align:center;color:var(--muted);font-size:12px;">
             SVG preview unavailable — <a href="${svgData.url}" target="_blank" style="color:var(--blue);">Open in new tab</a>
           </div>`
        : `<div style="padding:20px;text-align:center;color:var(--muted);font-size:12px;">SVG not yet uploaded</div>`
      }
      <div id="regen-infographic-panel" style="display:none;padding:12px;border-top:1px solid var(--border);">
        <textarea id="regen-infographic-txt" placeholder="Describe changes... e.g. brighter colours, add Tamil labels, more glow effects"
          style="width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:8px;
          color:var(--text);font-family:inherit;font-size:12px;padding:8px;resize:vertical;min-height:60px;outline:none;"></textarea>
        <div style="display:flex;gap:8px;margin-top:8px;align-items:center;">
          <button onclick="submitInfographicRegen(${n})"
            style="padding:6px 14px;border-radius:6px;background:var(--accent);border:none;color:white;font-size:12px;cursor:pointer;">
            ⚡ Regenerate Infographic
          </button>
          <button onclick="document.getElementById('regen-infographic-panel').style.display='none'"
            style="padding:6px 14px;border-radius:6px;background:var(--surface2);border:1px solid var(--border2);color:var(--muted2);font-size:12px;cursor:pointer;">
            Cancel
          </button>
          <label style="margin-left:auto;font-size:11px;color:var(--muted2);display:flex;align-items:center;gap:5px;">
            <input type="checkbox" id="save-pref-infographic" style="accent-color:var(--accent);"> Save as preference?
          </label>
        </div>
      </div>
    </div>
  ` : '';

  // Use script modal but repurpose for images
  document.getElementById('modal-ep-num').textContent = `Episode ${n} · ${ep.module}`;
  document.getElementById('modal-title').textContent = '🖼 Image Review';
  document.getElementById('modal-subtitle').textContent = ep.title_english;
  document.getElementById('modal-lang-tabs').style.display = 'none';
  document.getElementById('modal-script-ta').style.display = 'block';
  document.getElementById('modal-script-en').style.display = 'none';
  document.getElementById('script-content-ta').innerHTML = imgHtml + svgHtml;
  document.getElementById('script-content-ta').style.whiteSpace = 'normal';
  document.getElementById('script-content-ta').style.background = 'none';
  document.getElementById('script-content-ta').style.border = 'none';
  document.getElementById('script-content-ta').style.padding = '0';
  document.getElementById('modal-approve-btn').textContent = '✓ Approve Images';
  document.getElementById('modal-approve-btn').disabled = ep.status === 'images_approved';
  document.getElementById('modal-approve-btn').onclick = () => {
    closeModal();
    quickApprove(n, 'images_approved'); // auto-triggers video
  };
  document.getElementById('modal-regen-btn').style.display = 'none'; // per-image regen handled inline
  document.getElementById('modal-status-note').textContent = `status: ${ep.status}`;
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

// ── Video Preview ────────────────────────────────────────────
function previewVideo(n) {
  const ep = episodes.find(e => e.episode_number === n);
  if (!ep?.video_url) { showToast('Video URL not available', 'info'); return; }
  window.open(ep.video_url, '_blank');
}

async function uploadYouTube(n) {
  showToast('YouTube upload — coming in next sprint', 'info');
}

// ── Supabase helpers ─────────────────────────────────────────
async function patchEpisode(n, data) {
  return patchTable(TABLE(), n, data);
}

async function patchTable(table, n, data) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?episode_number=eq.${n}`, {
    method: 'PATCH',
    headers: { ...H, 'Prefer': 'return=minimal' },
    body: JSON.stringify(data)
  });
  if (!r.ok) throw new Error(`Supabase error ${r.status}`);
}

// ── Utilities ────────────────────────────────────────────────
function showLoader(on) {
  document.getElementById('loadbar').classList.toggle('show', on);
}

function showToast(msg, type='info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type}`;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

const delay = ms => new Promise(r => setTimeout(r, ms));

// Keyboard close modal
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('modal-overlay').classList.remove('open');
    document.body.style.overflow = '';
    modalEp = null;
  }
});

// ── Infographic Regenerate ───────────────────────────────────
function regenInfographic(epNum) {
  const panel = document.getElementById('regen-infographic-panel');
  if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}

async function submitInfographicRegen(epNum) {
  const note = document.getElementById('regen-infographic-txt')?.value.trim();
  if (!note) { showToast('Please describe what to change', 'error'); return; }

  const savePref = document.getElementById('save-pref-infographic')?.checked;
  if (savePref) {
    await fetch(`${SB_URL}/rest/v1/channel_preferences`, {
      method: 'POST', headers: H,
      body: JSON.stringify({
        category: 'infographic',
        preference: note,
        episode_number: epNum,
        is_active: true
      })
    });
    showToast('Infographic preference saved ✓', 'info');
  }

  // Trigger SVG-ONLY regeneration — images stay untouched
  try {
    const r = await fetch(EDGE_SVG_FN, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SB_KEY}` },
      body: JSON.stringify({ episode_number: epNum, regen_note: note })
    });
    const data = await r.json();
    if (data.success) {
      showToast('SVG regenerating — images untouched ✓', 'success');
      closeModal();
      setTimeout(load, 2000);
    } else {
      throw new Error(data.error || 'Unknown error');
    }
  } catch(e) {
    showToast(`Error: ${e.message}`, 'error');
  }
}

// ── Single Image Regenerate ──────────────────────────────────
function regenSingleImage(epNum, sceneId, label) {
  const panel = document.getElementById(`regen-note-img-${sceneId}`);
  if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}

async function submitSingleRegen(epNum, sceneId) {
  const note = document.getElementById(`regen-txt-img-${sceneId}`)?.value.trim();
  if (!note) { showToast('Please describe what to change', 'error'); return; }

  const savePref = document.getElementById(`save-pref-img-${sceneId}`)?.checked;
  if (savePref) {
    await fetch(`${SB_URL}/rest/v1/channel_preferences`, {
      method: 'POST', headers: H,
      body: JSON.stringify({
        category: 'image',
        preference: `Scene ${sceneId}: ${note}`,
        episode_number: epNum,
        is_active: true
      })
    });
    showToast('Image preference saved ✓', 'info');
  }

  // Store regen note and re-trigger image generation for this episode
  await patchTable('tamil_episodes', epNum, {
    regenerate_note: `Regenerate scene ${sceneId}: ${note}`,
    status: 'script_approved'
  });

  showToast(`Queuing Scene ${sceneId} regeneration...`, 'info');
  closeModal();
  await generateImages(epNum);
}

// ── Init ─────────────────────────────────────────────────────
load();
setInterval(load, 60000); // refresh every 60s
</script>
