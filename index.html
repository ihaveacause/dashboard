<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Have a Cause — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#080a0f;--surface:#0f1218;--surface2:#161b24;--surface3:#1c2230;
  --border:#1e2535;--border2:#252d40;--text:#dde3f0;--muted:#5a6480;--muted2:#8892aa;
  --accent:#e8412a;--accent2:#ff6b4a;
  --tamil:#f59e0b;--tamil-dim:rgba(245,158,11,0.12);
  --english:#3b82f6;--english-dim:rgba(59,130,246,0.12);
  --green:#10b981;--green-dim:rgba(16,185,129,0.12);
  --purple:#8b5cf6;--purple-dim:rgba(139,92,246,0.12);
  --teal:#14b8a6;--teal-dim:rgba(20,184,166,0.12);
  --red:#ef4444;--red-dim:rgba(239,68,68,0.12);
  --yellow:#f59e0b;--yellow-dim:rgba(245,158,11,0.12);
  --orange:#f97316;--orange-dim:rgba(249,115,22,0.12);
  --blue:#3b82f6;--blue-dim:rgba(59,130,246,0.12);
  --yt:#ff3333;--yt-dim:rgba(255,51,51,0.1);
  --shorts:#ff6600;--shorts-dim:rgba(255,102,0,0.1);
  --xc:#e7e9ea;--x-dim:rgba(231,233,234,0.08);
  --idea:#a78bfa;--idea-dim:rgba(167,139,250,0.12);
  --stats:#22d3ee;--stats-dim:rgba(34,211,238,0.1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

.loading-bar{height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent));background-size:200% 100%;animation:loadbar 1.2s ease infinite;position:fixed;top:0;left:0;right:0;z-index:9999;display:none}
.loading-bar.show{display:block}
@keyframes loadbar{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* L1 Topbar */
.topbar{display:flex;align-items:center;padding:0 28px;height:58px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;gap:0}
.logo{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:-0.3px;white-space:nowrap;margin-right:32px}
.logo em{color:var(--accent);font-style:normal}
.l1-nav{display:flex;gap:2px;flex:1}
.l1-btn{padding:0 20px;height:58px;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;border:none;background:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;margin-bottom:-1px}
.l1-btn:hover{color:var(--text)}
.l1-btn.active-stats{color:var(--stats);border-bottom-color:var(--stats)}
.l1-btn.active-series{color:var(--text);border-bottom-color:var(--text)}
.l1-btn.active-ideas{color:var(--idea);border-bottom-color:var(--idea)}
.topbar-right{margin-left:auto;display:flex;gap:10px;align-items:center}
.btn-gen-all{padding:8px 18px;background:var(--accent);border:none;border-radius:8px;color:white;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-gen-all:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-gen-all:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* L2 Platform Tabs */
.platform-bar{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:58px;z-index:199;padding:0 28px;display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none}
.platform-bar::-webkit-scrollbar{display:none}
.platform-bar.hidden{display:none}
.ptab{display:flex;align-items:center;gap:7px;padding:0 18px;height:44px;font-family:'Syne',sans-serif;font-size:13px;font-weight:600;color:var(--muted);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;margin-bottom:-1px}
.ptab:hover{color:var(--text)}
.ptab.active-youtube{color:var(--yt);border-bottom-color:var(--yt)}
.ptab.active-shorts{color:var(--shorts);border-bottom-color:var(--shorts)}
.ptab.active-x{color:var(--xc);border-bottom-color:var(--xc)}
.ptab-count{font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 7px;border-radius:10px;background:var(--surface2);color:var(--muted)}
.ptab.active-youtube .ptab-count{background:var(--yt-dim);color:var(--yt)}
.ptab.active-shorts .ptab-count{background:var(--shorts-dim);color:var(--shorts)}
.ptab.active-x .ptab-count{background:var(--x-dim);color:var(--xc)}

/* L3 Filter Bar */
.filter-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;position:sticky;top:102px;z-index:198}
.filter-bar.hidden{display:none}
.filter-row{display:flex;gap:4px;padding:9px 0;overflow-x:auto;scrollbar-width:none;align-items:center}
.filter-row::-webkit-scrollbar{display:none}
.lang-toggle{display:flex;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:3px;gap:3px;flex-shrink:0}
.lang-btn{padding:5px 16px;border-radius:7px;border:none;background:transparent;color:var(--muted2);font-family:'Syne',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.lang-btn.active-ta{background:var(--tamil-dim);color:var(--tamil);border:1px solid rgba(245,158,11,.25)}
.lang-btn.active-en{background:var(--english-dim);color:var(--english);border:1px solid rgba(59,130,246,.25)}
.filter-divider{width:1px;height:20px;background:var(--border2);margin:0 8px;flex-shrink:0}
.filter-btn{padding:5px 14px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--muted);font-family:'Inter',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap}
.filter-btn:hover{color:var(--text);border-color:var(--border2)}
.filter-btn.active{background:var(--accent);color:white;border-color:var(--accent)}
.gen-progress{display:none;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:10px 16px;font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--muted2);margin:10px 0 4px}
.gen-progress.show{display:block}
.gen-progress-bar{height:4px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden}
.gen-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .4s ease;width:0%}

/* Main */
.main{padding:24px 28px;max-width:1120px;margin:0 auto}
.bucket-label{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:var(--muted);letter-spacing:1px;text-transform:uppercase;padding:20px 0 10px}
.bucket-label:first-child{padding-top:0}
.episodes-grid{display:grid;gap:12px}

/* Episode Card */
.ep-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:border-color .2s,transform .15s}
.ep-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.ep-card.st-pending{border-left:3px solid var(--muted)}
.ep-card.st-generating{border-left:3px solid var(--orange)}
.ep-card.st-script_ready{border-left:3px solid var(--blue)}
.ep-card.st-script_approved{border-left:3px solid var(--yellow)}
.ep-card.st-images_ready{border-left:3px solid var(--purple)}
.ep-card.st-images_approved{border-left:3px solid var(--purple)}
.ep-card.st-x_images_ready{border-left:3px solid var(--xc)}
.ep-card.st-video_ready{border-left:3px solid var(--green)}
.ep-card.st-video_approved{border-left:3px solid var(--green)}
.ep-card.st-published{border-left:3px solid var(--accent);opacity:.85}
.ep-header{padding:16px 18px 14px;display:flex;align-items:flex-start;gap:14px}
.ep-num{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;color:var(--muted);background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:3px 8px;flex-shrink:0;margin-top:2px}
.ep-body{flex:1;min-width:0}
.ep-meta{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.module-badge{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:500;padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.5px}
.mod-1{background:rgba(245,158,11,.1);color:#f59e0b}
.mod-2{background:rgba(139,92,246,.1);color:#8b5cf6}
.mod-3{background:rgba(59,130,246,.1);color:#3b82f6}
.mod-4{background:rgba(239,68,68,.1);color:#ef4444}
.mod-5{background:rgba(16,185,129,.1);color:#10b981}
.mod-6{background:rgba(20,184,166,.1);color:#14b8a6}
.pillar-badge{font-family:'JetBrains Mono',monospace;font-size:9px;padding:2px 7px;border-radius:4px;background:var(--surface2);color:var(--muted2)}
.status-badge{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;padding:2px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.5px;margin-left:auto}
.sb-pending{background:rgba(90,100,128,.15);color:var(--muted2)}
.sb-generating{background:var(--orange-dim);color:var(--orange)}
.sb-script_ready{background:var(--blue-dim);color:var(--blue)}
.sb-script_approved{background:var(--yellow-dim);color:var(--yellow)}
.sb-images_ready{background:var(--purple-dim);color:var(--purple)}
.sb-images_approved{background:var(--purple-dim);color:var(--purple)}
.sb-x_images_ready{background:var(--x-dim);color:var(--xc)}
.sb-video_ready{background:var(--green-dim);color:var(--green)}
.sb-video_approved{background:var(--green-dim);color:var(--green)}
.sb-published{background:rgba(232,65,42,.12);color:var(--accent2)}
.ep-title-ta{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;line-height:1.5;color:var(--text);margin-bottom:3px}
.ep-title-en{font-size:12px;color:var(--muted2);line-height:1.4;margin-bottom:6px}
.ep-bridge{font-size:11px;color:var(--muted);font-style:italic;line-height:1.4}
.ep-actions{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Idea Card */
.idea-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--idea);border-radius:14px;overflow:hidden;transition:border-color .2s,transform .15s;margin-bottom:12px}
.idea-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.idea-card.st-published{opacity:.8}
.idea-header{padding:16px 18px 14px;display:flex;align-items:flex-start;gap:12px}
.idea-icon-tag{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;padding:3px 8px;border-radius:5px;background:var(--idea-dim);color:var(--idea);flex-shrink:0;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.idea-body{flex:1;min-width:0}
.idea-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--text);margin-bottom:5px;line-height:1.4}
.idea-desc{font-size:12px;color:var(--muted2);line-height:1.6;margin-bottom:4px}
.idea-angle{font-size:11px;color:var(--muted);font-style:italic}
.idea-actions{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Buttons */
.btn{padding:7px 16px;border-radius:8px;font-size:12px;font-weight:600;font-family:'Inter',sans-serif;border:1px solid transparent;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-generate{background:var(--accent);color:white;border-color:var(--accent)}
.btn-review{background:var(--blue-dim);color:var(--blue);border-color:rgba(59,130,246,.3)}
.btn-approve{background:var(--green-dim);color:var(--green);border-color:rgba(16,185,129,.3)}
.btn-regen{background:var(--surface2);color:var(--muted2);border-color:var(--border2)}
.btn-preview{background:var(--teal-dim);color:var(--teal);border-color:rgba(20,184,166,.3)}
.btn-youtube{background:var(--yt-dim);color:var(--yt);border-color:rgba(255,51,51,.3)}
.btn-shorts{background:var(--shorts-dim);color:var(--shorts);border-color:rgba(255,102,0,.3)}
.btn-x{background:var(--x-dim);color:var(--xc);border-color:rgba(231,233,234,.2)}
.btn-idea{background:var(--idea-dim);color:var(--idea);border-color:rgba(167,139,250,.3)}
.generating-banner{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--orange);font-family:'JetBrains Mono',monospace}
.spin{display:inline-block;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.waiting-banner{font-size:12px;color:var(--muted2);font-family:'JetBrains Mono',monospace}

/* Channel Stats */
.stats-page{display:flex;flex-direction:column;gap:20px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 18px}
.stat-val{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:500;margin-bottom:4px;line-height:1}
.stat-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-family:'JetBrains Mono',monospace;margin-bottom:8px}
.stat-sub{font-size:12px;color:var(--muted2)}
.stat-progress{height:3px;background:var(--border);border-radius:2px;margin-top:12px;overflow:hidden}
.stat-progress-fill{height:100%;border-radius:2px;transition:width .6s ease}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stats-panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
.stats-panel-title{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:14px}
.stats-row-item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.stats-row-item:last-child{border-bottom:none}
.stats-row-num{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500}
.series-progress{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
.progress-bar-big{height:8px;background:var(--border);border-radius:4px;margin:12px 0 8px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;transition:width .8s ease}
.progress-labels{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}

/* Secrets note */
.secrets-note{background:var(--surface);border:1px solid rgba(245,158,11,.25);border-radius:12px;padding:14px 18px;margin-bottom:16px}
.secrets-note-title{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:var(--yellow);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.secrets-note-body{font-size:12px;color:var(--muted2);line-height:1.7}
.secrets-note-body code{font-family:'JetBrains Mono',monospace;font-size:11px;background:var(--surface2);padding:1px 5px;border-radius:3px;color:var(--text)}

/* Modals */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:18px;width:100%;max-width:860px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;animation:modalIn .25s ease}
.modal.modal-sm{max-width:520px}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px}
.modal-ep-info{flex:1}
.modal-ep-num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:4px}
.modal-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;line-height:1.4}
.modal-subtitle{font-size:12px;color:var(--muted2);margin-top:3px}
.modal-close{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;color:var(--muted2);width:32px;height:32px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.modal-close:hover{color:var(--text);border-color:var(--border)}
.modal-lang-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 24px}
.modal-lang-tab{padding:10px 18px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;color:var(--muted);border:none;border-bottom:2px solid transparent;background:none;cursor:pointer;transition:all .2s;margin-bottom:-1px}
.modal-lang-tab:hover{color:var(--text)}
.modal-lang-tab.active-ta{color:var(--tamil);border-bottom-color:var(--tamil)}
.modal-lang-tab.active-en{color:var(--english);border-bottom-color:var(--english)}
.modal-body{flex:1;overflow-y:auto;padding:24px;scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
.script-text{font-size:14px;line-height:1.8;color:var(--text);white-space:pre-wrap;font-family:'Inter',sans-serif;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:20px}
.script-empty{text-align:center;color:var(--muted);font-size:13px;padding:40px;font-family:'JetBrains Mono',monospace}
.x-thread-preview{display:flex;flex-direction:column;gap:10px}
.x-tweet{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;font-size:13px;line-height:1.7;position:relative}
.x-tweet-num{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);margin-bottom:6px}
.x-tweet-img{width:100%;border-radius:8px;margin-top:10px;display:block}
.regen-section{margin-top:16px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:16px;display:none}
.regen-section.open{display:block}
.regen-label{font-size:12px;font-weight:600;color:var(--muted2);margin-bottom:8px;font-family:'JetBrains Mono',monospace}
.regen-textarea{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:10px 12px;resize:vertical;min-height:80px;outline:none;transition:border-color .2s}
.regen-textarea:focus{border-color:var(--accent)}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.modal-status-note{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-left:auto}

/* Idea Submit Modal */
.form-group{margin-bottom:16px}
.form-label{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:block}
.form-input,.form-textarea{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:10px 12px;outline:none;transition:border-color .2s}
.form-input:focus,.form-textarea:focus{border-color:var(--accent)}
.form-textarea{resize:vertical;min-height:80px}

/* X Link Modal */
.x-link-modal-body{padding:20px 24px}
.x-link-lang-row{display:flex;gap:10px;margin-bottom:16px}
.x-lang-opt{flex:1;padding:10px 14px;border-radius:10px;border:1px solid var(--border2);background:var(--surface2);color:var(--muted2);font-family:'Syne',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center}
.x-lang-opt.selected-ta{background:var(--tamil-dim);color:var(--tamil);border-color:rgba(245,158,11,.4)}
.x-lang-opt.selected-en{background:var(--english-dim);color:var(--english);border-color:rgba(59,130,246,.4)}

/* Toast */
.toast{position:fixed;bottom:28px;right:28px;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:12px 18px;font-size:13px;font-family:'JetBrains Mono',monospace;color:var(--text);z-index:9999;transform:translateY(80px);opacity:0;transition:all .3s;max-width:340px}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-color:rgba(16,185,129,.4);color:var(--green)}
.toast.error{border-color:rgba(239,68,68,.4);color:var(--red)}
.toast.info{border-color:rgba(59,130,246,.4);color:var(--blue)}

/* Empty */
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state .empty-icon{font-size:40px;margin-bottom:12px}
.empty-state p{font-size:14px;font-family:'JetBrains Mono',monospace}
</style>
</head>
<body>
<div class="loading-bar" id="loadbar"></div>

<!-- L1 Topbar -->
<div class="topbar">
  <div class="logo">I Have A <em>Cause</em></div>
  <nav class="l1-nav">
    <button class="l1-btn" id="l1-stats"   onclick="setL1('stats')">Channel Stats</button>

<script>
// ── Config ────────────────────────────────────────────────────
const SB_URL      = 'https://alfuvzlmatfkgdrkeqgk.supabase.co';
const SB_KEY      = 'sb_publishable_W6dVLZyqGI60qF6nDchJWg_kv2ZFfhn';

// Sprint 7 edge functions
const EDGE_FN           = `${SB_URL}/functions/v1/trigger-script-gen`;
const EDGE_IMG_FN       = `${SB_URL}/functions/v1/trigger-image-gen`;
const EDGE_VIDEO_FN     = `${SB_URL}/functions/v1/trigger-video-gen`;
const EDGE_SVG_FN       = `${SB_URL}/functions/v1/trigger-svg-gen`;
const EDGE_IDEA_FN      = `${SB_URL}/functions/v1/trigger-idea-gen`;
const EDGE_IDEA_IMG_FN  = `${SB_URL}/functions/v1/trigger-idea-image-gen`;
const EDGE_IDEA_VIDEO_FN= `${SB_URL}/functions/v1/trigger-idea-video-gen`;

// Sprint 8 edge functions
const EDGE_SHORTS_VIDEO_FN    = `${SB_URL}/functions/v1/trigger-shorts-video-gen`;
const EDGE_X_IMAGES_FN        = `${SB_URL}/functions/v1/trigger-x-images-gen`;
const EDGE_X_POST_FN          = `${SB_URL}/functions/v1/trigger-x-post`;
const EDGE_IDEA_YT_UPLOAD_FN  = `${SB_URL}/functions/v1/trigger-idea-youtube-upload`;

const H      = {'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json'};
const EDGE_H = {'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json'};

// ── State ─────────────────────────────────────────────────────
let activeL1       = 'series';
let activePlatform = 'youtube';
let lang           = 'ta';
let filter         = 'all';
let episodes       = [];
let ideas          = [];
let modalEp        = null;
let modalLang      = 'ta';
let modalPlatform  = 'youtube';
let xPostTarget    = null;  // {n, isIdea} for X modal
let xPostLang      = 'ta';

// ── Platform config ───────────────────────────────────────────
const PLATFORMS = {
  youtube: { label:'YouTube Long',   statusCol:'status',         color:'var(--yt)',     scriptColTa:'script_tamil',            scriptColEn:'script_english' },
  shorts:  { label:'Shorts / Reels', statusCol:'status_shorts',  color:'var(--shorts)', scriptColTa:'script_shorts_tamil',     scriptColEn:'script_shorts_english' },
  x:       { label:'X / Twitter',    statusCol:'status_x',       color:'var(--xc)',     scriptColTa:'script_x_thread_tamil',   scriptColEn:'script_x_thread_english' }
};

const PLATFORM_STATUSES = {
  youtube: ['pending','generating','script_ready','script_approved','images_ready','images_approved','video_ready','video_approved','published'],
  shorts:  ['pending','script_ready','script_approved','images_ready','images_approved','video_ready','video_approved','published'],
  x:       ['pending','script_ready','script_approved','x_images_ready','published']
};

const STATUS_LABELS = {
  pending:'Pending', generating:'Generating', script_ready:'Script Ready',
  script_approved:'Script Approved', images_ready:'Images Ready', images_approved:'Images Approved',
  x_images_ready:'X Images Ready',
  video_ready:'Video Ready', video_approved:'Video Approved', published:'Published'
};

const TABLE = () => lang === 'ta' ? 'tamil_episodes' : 'english_episodes';
const MODULE_NUM = m => { const n = m?.match(/Module (\d)/); return n ? parseInt(n[1]) : 1; };
const delay = ms => new Promise(r => setTimeout(r,ms));

// ── Navigation ────────────────────────────────────────────────
function setL1(tab) {
  activeL1 = tab;
  ['stats','series','ideas'].forEach(t => {
    const b = document.getElementById(`l1-${t}`);
    b.className = `l1-btn${t===tab ? ` active-${t}` : ''}`;
  });
  document.getElementById('platform-bar').classList.toggle('hidden', tab==='stats');
  document.getElementById('filter-bar').classList.toggle('hidden', tab==='stats');
  document.getElementById('btn-gen-all').style.display = (tab==='series' && activePlatform==='youtube') ? '' : 'none';
  updateFilterPills();
  load();
}

function setPlatform(p) {
  activePlatform = p;
  ['youtube','shorts','x'].forEach(t => {
    const b = document.getElementById(`pt-${t}`);
    b.className = `ptab${t===p ? ` active-${t}` : ''}`;
  });
  document.getElementById('btn-gen-all').style.display =
    (activeL1==='series' && p==='youtube') ? '' : 'none';
  filter = 'all';
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.filter-btn')?.classList.add('active');
  updateFilterPills();
  render();
}

function updateFilterPills() {
  if (activeL1 === 'stats') return;
  const statuses = PLATFORM_STATUSES[activePlatform] || PLATFORM_STATUSES.youtube;
  ['generating','images_ready','images_approved','x_images_ready','video_ready','video_approved'].forEach(s => {
    const el = document.getElementById(`fb-${s}`);
    if (el) el.style.display = statuses.includes(s) ? '' : 'none';
  });
}

// ── Load ──────────────────────────────────────────────────────
async function load() {
  if (activeL1 === 'stats') { await loadStats(); return; }
  if (activeL1 === 'ideas') { await loadIdeas(); return; }
  await loadEpisodes();
}

async function loadEpisodes() {
  showLoader(true);
  try {
    const r = await fetch(`${SB_URL}/rest/v1/${TABLE()}?select=*&order=episode_number.asc&limit=200`, {headers:H});
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    episodes = await r.json();
    updatePlatformCounts();
    render();
  } catch(e) {
    document.getElementById('main').innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><p>${e.message}</p></div>`;
  }
  showLoader(false);
}

async function loadIdeas() {
  showLoader(true);
  try {
    const r = await fetch(`${SB_URL}/rest/v1/ideas?select=*&order=created_at.desc&limit=100`, {headers:H});
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    ideas = await r.json();
    updatePlatformCountsIdeas();
    render();
  } catch(e) {
    document.getElementById('main').innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><p>${e.message}</p></div>`;
  }
  showLoader(false);
}

async function loadStats() {
  showLoader(true);
  try {
    const [ta, en, id] = await Promise.all([
      fetch(`${SB_URL}/rest/v1/tamil_episodes?select=status,status_shorts,status_x&limit=200`,{headers:H}).then(r=>r.json()),
      fetch(`${SB_URL}/rest/v1/english_episodes?select=status,status_shorts,status_x&limit=200`,{headers:H}).then(r=>r.json()),
      fetch(`${SB_URL}/rest/v1/ideas?select=status,status_shorts,status_x&limit=200`,{headers:H}).then(r=>r.json()),
    ]);
    renderStats(ta, en, id);
  } catch(e) {
    document.getElementById('main').innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><p>${e.message}</p></div>`;
  }
  showLoader(false);
}

// ── Counts ────────────────────────────────────────────────────
function updatePlatformCounts() {
  const col = p => PLATFORMS[p].statusCol;
  ['youtube','shorts','x'].forEach(p => {
    const c = col(p);
    const active = episodes.filter(e => (e[c]||'pending') !== 'pending').length;
    const pub    = episodes.filter(e => (e[c]||'pending') === 'published').length;
    document.getElementById(`cnt-${p}`).textContent = pub > 0 ? `${pub} live` : active > 0 ? `${active} active` : '—';
  });
}

function updatePlatformCountsIdeas() {
  ['youtube','shorts','x'].forEach(p => {
    const col = p==='youtube' ? 'status' : PLATFORMS[p].statusCol;
    const active = ideas.filter(i => (i[col]||'pending') !== 'pending').length;
    document.getElementById(`cnt-${p}`).textContent = active > 0 ? `${active} active` : '—';
  });
}

// ── Render ────────────────────────────────────────────────────
function render() {
  if (activeL1 === 'stats') return;
  if (activeL1 === 'ideas') { renderIdeasTab(); return; }
  renderSeriesTab();
}

function getEpStatus(ep) {
  const col = PLATFORMS[activePlatform].statusCol;
  return (ep[col] || 'pending');
}

function getIdeaStatus(idea) {
  const col = activePlatform === 'youtube' ? 'status' : PLATFORMS[activePlatform].statusCol;
  return (idea[col] || 'pending');
}

function renderSeriesTab() {
  let items = episodes.filter(ep => {
    const s = getEpStatus(ep);
    return filter === 'all' || s === filter;
  });

  if (!items.length) {
    document.getElementById('main').innerHTML = `<div class="empty-state"><div class="empty-icon">✨</div><p>No episodes in this view</p></div>`;
    return;
  }

  let html = '';
  if (filter === 'all') {
    const ORDER = ['generating','script_ready','script_approved','images_ready','images_approved','x_images_ready','video_ready','video_approved','published','pending'];
    const groups = {};
    items.forEach(ep => { const s = getEpStatus(ep); if (!groups[s]) groups[s]=[]; groups[s].push(ep); });
    ORDER.forEach(s => {
      if (groups[s]?.length) {
        const count = groups[s].length;
        html += `<div class="bucket-label">${STATUS_LABELS[s]||s} · ${count} episode${count>1?'s':''}</div>`;
        html += `<div class="episodes-grid">${groups[s].map(ep=>buildEpCard(ep)).join('')}</div>`;
      }
    });
  } else {
    html = `<div class="episodes-grid">${items.map(ep=>buildEpCard(ep)).join('')}</div>`;
  }
  document.getElementById('main').innerHTML = html;
}

function renderIdeasTab() {
  const addBtn = `<div style="margin-bottom:16px"><button class="btn btn-idea" onclick="openIdeaModal()" style="font-size:13px;padding:9px 20px">💡 New Idea</button></div>`;

  let items = ideas.filter(idea => {
    const s = getIdeaStatus(idea);
    return filter === 'all' || s === filter;
  });

  if (!items.length) {
    document.getElementById('main').innerHTML = addBtn + `<div class="empty-state"><div class="empty-icon">💡</div><p>No ideas yet — add your first one</p></div>`;
    return;
  }

  let html = addBtn;
  if (filter === 'all') {
    const ORDER = ['generating','script_ready','script_approved','images_ready','images_approved','x_images_ready','video_ready','video_approved','published','pending'];
    const groups = {};
    items.forEach(idea => { const s = getIdeaStatus(idea); if (!groups[s]) groups[s]=[]; groups[s].push(idea); });
    ORDER.forEach(s => {
      if (groups[s]?.length) {
        const count = groups[s].length;
        html += `<div class="bucket-label">${STATUS_LABELS[s]||s} · ${count} idea${count>1?'s':''}</div>`;
        groups[s].forEach(idea => { html += buildIdeaCard(idea); });
      }
    });
  } else {
    items.forEach(idea => { html += buildIdeaCard(idea); });
  }
  document.getElementById('main').innerHTML = html;
}

// ── Build Cards ───────────────────────────────────────────────
function buildEpCard(ep) {
  const status = getEpStatus(ep);
  const modNum = MODULE_NUM(ep.module);
  return `
  <div class="ep-card st-${status}" id="card-${ep.episode_number}">
    <div class="ep-header">
      <div class="ep-num">#${String(ep.episode_number).padStart(3,'0')}</div>
      <div class="ep-body">
        <div class="ep-meta">
          <span class="module-badge mod-${modNum}">M${modNum}</span>
          <span class="pillar-badge">${ep.pillar||''}</span>
          <span class="status-badge sb-${status}">${STATUS_LABELS[status]||status}</span>
        </div>
        <div class="ep-title-ta">${ep.title_tamil||''}</div>
        <div class="ep-title-en">${ep.title_english||''}</div>
        ${ep.bridge?`<div class="ep-bridge">↳ ${ep.bridge}</div>`:''}
      </div>
    </div>
    <div class="ep-actions">${buildActions(ep, status, false)}</div>
  </div>`;
}

function buildIdeaCard(idea) {
  const status = getIdeaStatus(idea);
  return `
  <div class="idea-card st-${status}" id="idea-card-${idea.id}">
    <div class="idea-header">
      <div class="idea-icon-tag">Idea</div>
      <div class="idea-body">
        <div class="ep-meta">
          <span class="status-badge sb-${status}" style="margin-left:0">${STATUS_LABELS[status]||status}</span>
          ${buildPlatformMarkers(idea)}
        </div>
        <div class="idea-title">${idea.title||''}</div>
        ${idea.description?`<div class="idea-desc">${idea.description}</div>`:''}
        ${idea.research_angle?`<div class="idea-angle">↳ ${idea.research_angle}</div>`:''}
      </div>
    </div>
    <div class="idea-actions">${buildActions(idea, status, true)}</div>
  </div>`;
}

function buildPlatformMarkers(idea) {
  const ytS  = idea.status || 'pending';
  const shS  = idea.status_shorts || 'pending';
  const xS   = idea.status_x || 'pending';
  const m = (label,s) => `<span style="font-family:'JetBrains Mono',monospace;font-size:9px;padding:2px 6px;border-radius:4px;background:${s==='published'?'var(--green-dim)':'var(--surface2)'};color:${s==='published'?'var(--green)':'var(--muted)'}">${label}</span>`;
  return `<div style="display:flex;gap:4px;margin-left:auto">${m('YT',ytS)}${m('S/R',shS)}${m('X',xS)}</div>`;
}

// ── Build Actions (all 12 tracks wired) ───────────────────────
function buildActions(item, status, isIdea) {
  const n  = isIdea ? `'${item.id}'` : item.episode_number;
  const p  = activePlatform;

  // ── YouTube Long ──────────────────────────────────────────
  if (p === 'youtube') {
    if (status === 'pending')
      return `<button class="btn btn-generate" onclick="${isIdea?`generateIdeaScript(${n})`:`generateScript(${n})`}">⚡ Generate All Scripts</button>`;
    if (status === 'generating')
      return `<div class="generating-banner"><span class="spin">⚙️</span> Gemini generating all formats — check back in a few minutes</div>`;
    if (status === 'script_ready')
      return `<button class="btn btn-review" onclick="openModal(${n},${isIdea})">📄 Review Script</button>
              <button class="btn btn-approve" onclick="quickApprove(${n},'script_approved',${isIdea})">✓ Approve Script</button>`;
    if (status === 'script_approved') {
      if (!isIdea && lang === 'en')
        return `<button class="btn btn-review" onclick="openModal(${n},false)">📄 View Script</button>
                <div class="waiting-banner">⏳ Waiting for Tamil episode to complete first</div>`;
      return `<button class="btn btn-review" onclick="openModal(${n},${isIdea})">📄 View Script</button>
              <button class="btn btn-preview" onclick="generateImages(${n},${isIdea})">🖼 Generate Images</button>`;
    }
    if (status === 'generating_images')
      return `<div class="generating-banner"><span class="spin">🎨</span> Imagen 3 generating — check back in ~5 min</div>`;
    if (status === 'images_ready')
      return `<button class="btn btn-review" onclick="openImagesModal(${n},${isIdea})">🖼 Review Images</button>
              <button class="btn btn-approve" onclick="quickApprove(${n},'images_approved',${isIdea})">✓ Approve Images</button>`;
    if (status === 'images_approved')
      return `<button class="btn btn-review" onclick="openImagesModal(${n},${isIdea})">🖼 View Images</button>
              <button class="btn btn-preview" onclick="generateVideo(${n},${isIdea})">🎬 Generate Video</button>`;
    if (status === 'rendering_video')
      return `<div class="generating-banner"><span class="spin">🎬</span> FFmpeg rendering — check back in ~15 min</div>`;
    if (status === 'video_ready')
      return `<button class="btn btn-preview" onclick="previewVideo(${n},${isIdea})">▶ Preview Video</button>
              <button class="btn btn-approve" onclick="quickApprove(${n},'video_approved',${isIdea})">✓ Approve for YouTube</button>`;
    if (status === 'video_approved') {
      if (isIdea)
        return `<button class="btn btn-youtube" onclick="uploadIdeaYouTube(${n})">▲ Upload to YouTube</button>
                <button class="btn btn-preview" onclick="previewVideo(${n},true)">▶ Preview</button>`;
      return `<button class="btn btn-youtube" onclick="uploadYouTube(${n},false)">▲ Upload to YouTube</button>
              <button class="btn btn-preview" onclick="previewVideo(${n},false)">▶ Preview</button>`;
    }
    if (status === 'published') {
      const url = item.youtube_url;
      return url
        ? `<a href="${url}" target="_blank" class="btn btn-youtube" style="text-decoration:none">▶ Watch on YouTube</a>`
        : `<span style="font-size:12px;color:var(--accent2);font-family:'JetBrains Mono',monospace">🚀 Published on YouTube</span>`;
    }
  }

  // ── Shorts / Reels ────────────────────────────────────────
  if (p === 'shorts') {
    if (status === 'pending')
      return `<div class="waiting-banner">⏳ Generate scripts from YouTube tab first</div>`;
    if (status === 'script_ready')
      return `<button class="btn btn-review" onclick="openModal(${n},${isIdea},'shorts')">✂ Review Short Script</button>
              <button class="btn btn-approve" onclick="quickApprove(${n},'script_approved',${isIdea},'status_shorts')">✓ Approve</button>`;
    if (status === 'script_approved')
      return `<button class="btn btn-review" onclick="openModal(${n},${isIdea},'shorts')">✂ View Script</button>
              <button class="btn btn-preview" onclick="generateImages(${n},${isIdea},'vertical')">🖼 Generate Vertical Images</button>`;
    if (status === 'generating_images')
      return `<div class="generating-banner"><span class="spin">🎨</span> Generating vertical images — check back in ~5 min</div>`;
    if (status === 'images_ready')
      return `<button class="btn btn-review" onclick="openImagesModal(${n},${isIdea},'vertical')">🖼 Review Images</button>
              <button class="btn btn-approve" onclick="quickApprove(${n},'images_approved',${isIdea},'status_shorts')">✓ Approve Images</button>`;
    if (status === 'images_approved')
      return `<button class="btn btn-shorts" onclick="generateShortVideo(${n},${isIdea})">🎬 Generate Short Video (AI voice)</button>`;
    if (status === 'rendering_video')
      return `<div class="generating-banner"><span class="spin">🎬</span> Rendering vertical video — check back in ~15 min</div>`;
    if (status === 'video_ready')
      return `<button class="btn btn-preview" onclick="previewVideo(${n},${isIdea},'short')">▶ Preview Short</button>
              <button class="btn btn-approve" onclick="quickApprove(${n},'video_approved',${isIdea},'status_shorts')">✓ Approve</button>`;
    if (status === 'video_approved')
      return `<button class="btn btn-shorts" onclick="publishShortsReels(${n},${isIdea})">▲ Publish to Shorts & Reels</button>
              <button class="btn btn-preview" onclick="previewVideo(${n},${isIdea},'short')">▶ Preview</button>`;
    if (status === 'published') {
      const ytS = item.youtube_shorts_url;
      const rlS = item.reels_url;
      return `${ytS?`<a href="${ytS}" target="_blank" class="btn btn-shorts" style="text-decoration:none">▶ Shorts</a>`:''}
              ${rlS?`<a href="${rlS}" target="_blank" class="btn btn-shorts" style="text-decoration:none">▶ Reels</a>`:''}
              ${(!ytS&&!rlS)?`<span style="font-size:12px;color:var(--shorts);font-family:'JetBrains Mono',monospace">🚀 Published Shorts & Reels</span>`:''}`;
    }
  }

  // ── X / Twitter ───────────────────────────────────────────
  if (p === 'x') {
    if (status === 'pending')
      return `<div class="waiting-banner">⏳ Generate scripts from YouTube tab first</div>`;
    if (status === 'script_ready')
      return `<button class="btn btn-review" onclick="openModal(${n},${isIdea},'x')">𝕏 Review X Thread</button>
              <button class="btn btn-approve" onclick="quickApprove(${n},'script_approved',${isIdea},'status_x')">✓ Approve Thread</button>`;
    if (status === 'script_approved')
      return `<button class="btn btn-review" onclick="openModal(${n},${isIdea},'x')">𝕏 View Thread</button>
              <button class="btn btn-x" onclick="generateXImages(${n},${isIdea})">🖼 Generate X Images</button>`;
    if (status === 'generating_x_images')
      return `<div class="generating-banner"><span class="spin">🖼</span> Generating 6 images per thread — ~10 min</div>`;
    if (status === 'x_images_ready')
      return `<button class="btn btn-review" onclick="openXImagesModal(${n},${isIdea})">🖼 Review X Images</button>
              <button class="btn btn-x" onclick="openXPostModal(${n},${isIdea})">𝕏 Post to X</button>`;
    if (status === 'published') {
      const urlTa = item.x_post_url_tamil;
      const urlEn = item.x_post_url_english;
      return `${urlTa?`<a href="${urlTa}" target="_blank" class="btn btn-x" style="text-decoration:none">𝕏 Tamil Thread</a>`:''}
              ${urlEn?`<a href="${urlEn}" target="_blank" class="btn btn-x" style="text-decoration:none">𝕏 English Thread</a>`:''}
              ${(!urlTa&&!urlEn)?`<span style="font-size:12px;color:var(--xc);font-family:'JetBrains Mono',monospace">🚀 Posted on X</span>`:''}`;
    }
  }

  return `<span style="font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace">${STATUS_LABELS[status]||status}</span>`;
}

// ── Script Actions ────────────────────────────────────────────
async function generateScript(n) {
  const card = document.getElementById(`card-${n}`);
  const btn  = card?.querySelector('.btn-generate');
  if (btn) { btn.disabled=true; btn.textContent='⚙️ Triggering...'; }
  try {
    const r = await fetch(EDGE_FN,{method:'POST',headers:EDGE_H,body:JSON.stringify({episode_number:n})});
    const data = await r.json();
    if (data.success) {
      await patchEpisode(n,{status:'generating'});
      showToast(`Episode ${n} queued — all format scripts generating`,'success');
      setTimeout(loadEpisodes,1500);
    } else throw new Error(data.error||'Unknown error');
  } catch(e) {
    showToast(`Error: ${e.message}`,'error');
    if (btn) { btn.disabled=false; btn.textContent='⚡ Generate All Scripts'; }
  }
}

async function generateAll() {
  const pending = episodes.filter(e => (e.status||'pending')==='pending');
  if (!pending.length) { showToast('No pending episodes','info'); return; }
  const btn  = document.getElementById('btn-gen-all');
  const prog = document.getElementById('gen-progress');
  const fill = document.getElementById('gen-progress-fill');
  const txt  = document.getElementById('gen-progress-text');
  btn.disabled=true; btn.textContent=`⚙️ Queueing ${pending.length}...`;
  prog.classList.add('show');
  let done=0;
  for (const ep of pending) {
    txt.textContent=`Triggering Episode ${ep.episode_number} (${done+1}/${pending.length})...`;
    fill.style.width=`${Math.round((done/pending.length)*100)}%`;
    try {
      await fetch(EDGE_FN,{method:'POST',headers:EDGE_H,body:JSON.stringify({episode_number:ep.episode_number})});
      await patchEpisode(ep.episode_number,{status:'generating'});
    } catch(e) {}
    done++; await delay(2000);
  }
  fill.style.width='100%'; txt.textContent=`✅ All ${done} queued!`;
  btn.disabled=false; btn.textContent='⚡ Generate All Pending';
  showToast(`${done} episodes queued`,'success');
  setTimeout(()=>{ prog.classList.remove('show'); loadEpisodes(); },3000);
}

async function quickApprove(n, newStatus, isIdea=false, col=null) {
  try {
    if (isIdea) {
      const statusCol = col || (activePlatform==='youtube'?'status':PLATFORMS[activePlatform].statusCol);
      await patchIdea(n,{[statusCol]:newStatus});
      showToast(`Idea → ${STATUS_LABELS[newStatus]}`,'success');
      loadIdeas();
    } else {
      const statusCol = col || PLATFORMS[activePlatform].statusCol;
      await patchTable(TABLE(),n,{[statusCol]:newStatus});
      if (activePlatform==='youtube' && newStatus==='script_approved' && lang==='ta') {
        await patchTable('english_episodes',n,{status:'script_ready'});
      }
      showToast(`Episode ${n} → ${STATUS_LABELS[newStatus]}`,'success');
      loadEpisodes();
    }
  } catch(e) { showToast(`Error: ${e.message}`,'error'); }
}

    const data = await r.json();
    if (data.success) {
      showToast(`𝕏 Thread posting triggered — ${xPostLang === 'ta' ? 'Tamil' : 'English'} · check X in ~2 min`,'success');
      closeXModal();
      setTimeout(load, 2000);
    } else throw new Error(data.error||'Error');
  } catch(e) {
    showToast(`Error: ${e.message}`,'error');
    btn.disabled=false; btn.textContent='𝕏 Post Thread Now';
  }
}

// ── Ideas ─────────────────────────────────────────────────────
function openIdeaModal() {
  document.getElementById('idea-title').value='';
  document.getElementById('idea-desc').value='';
  document.getElementById('idea-angle').value='';
  document.getElementById('idea-modal-overlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeIdeaModal(event) {
  if (event && event.target!==document.getElementById('idea-modal-overlay')) return;
  document.getElementById('idea-modal-overlay').classList.remove('open');
  document.body.style.overflow='';
}

async function submitIdea() {
  const title = document.getElementById('idea-title').value.trim();
  const desc  = document.getElementById('idea-desc').value.trim();
  const angle = document.getElementById('idea-angle').value.trim();
  if (!title) { showToast('Please enter an idea title','error'); return; }
  try {
    const r = await fetch(`${SB_URL}/rest/v1/ideas`,{
      method:'POST', headers:{...H,'Prefer':'return=representation'},
      body:JSON.stringify({title,description:desc,research_angle:angle,status:'pending',status_shorts:'pending',status_x:'pending'})
    });
    if (!r.ok) throw new Error(`Supabase error ${r.status}`);
    const [newIdea] = await r.json();
    const ef = await fetch(EDGE_IDEA_FN,{method:'POST',headers:EDGE_H,body:JSON.stringify({idea_id:newIdea.id})});
    const efData = await ef.json();
    if (!efData.success) throw new Error(efData.error || 'Edge function failed');
    await patchIdea(newIdea.id,{status:'generating',status_shorts:'generating',status_x:'generating'});
    showToast('Idea saved — Gemini generating all scripts','success');
    closeIdeaModal();
    setL1('ideas');
  } catch(e) { showToast(`Error: ${e.message}`,'error'); }
}

async function generateIdeaScript(id) {
  const card = document.getElementById(`idea-card-${id}`);
  const btn  = card?.querySelector('.btn-generate');
  if (btn) { btn.disabled=true; btn.textContent='⚙️ Triggering...'; }
  try {
    await patchIdea(id, {status:'generating',status_shorts:'generating',status_x:'generating'});
    const r = await fetch(EDGE_IDEA_FN,{method:'POST',headers:EDGE_H,body:JSON.stringify({idea_id:id})});
    const data = await r.json();
    if (data.success) {
      showToast('Gemini generating all format scripts — a few minutes','success');
      setTimeout(loadIdeas,1500);
    } else throw new Error(data.error||'Edge function error');
  } catch(e) {
    showToast(`Error: ${e.message}`,'error');
    await patchIdea(id,{status:'pending',status_shorts:'pending',status_x:'pending'});
    if (btn) { btn.disabled=false; btn.textContent='⚡ Generate All Scripts'; }
  }
}

// ── Script Modal ──────────────────────────────────────────────
function openModal(n, isIdea=false, platform=null) {
  const p   = platform || activePlatform;
  const cfg = PLATFORMS[p];
  const item = isIdea ? ideas.find(i=>i.id===n) : episodes.find(e=>e.episode_number===n);
  if (!item) return;
  modalEp   = item;
  modalLang = lang;
  modalPlatform = p;

  const label = isIdea ? `Idea · ${p==='x'?'X Thread':cfg.label}` : `Episode ${n} · ${p==='x'?'X Thread':cfg.label}`;
  document.getElementById('modal-ep-num').textContent = label;
  document.getElementById('modal-title').textContent  = isIdea ? item.title : item.title_tamil;
  document.getElementById('modal-subtitle').textContent = isIdea ? '' : (item.title_english||'');

  const tScript = item[cfg.scriptColTa] || '';
  const eScript = item[cfg.scriptColEn] || '';
  const fmt = p==='x' ? formatXThread : s=>s;

  document.getElementById('script-content-ta').innerHTML = tScript ? fmt(tScript) : '<div class="script-empty">— Script not generated yet —</div>';
  document.getElementById('script-content-en').innerHTML = eScript ? fmt(eScript) : '<div class="script-empty">— Script not generated yet —</div>';

  if (p !== 'x') {
    document.getElementById('script-content-ta').className = tScript?'script-text':'';
    document.getElementById('script-content-en').className = eScript?'script-text':'';
  }

  document.getElementById('regen-ta').classList.remove('open');
  document.getElementById('regen-en').classList.remove('open');
  document.getElementById('modal-lang-tabs').style.display='';
  document.getElementById('modal-approve-btn').style.display='';
  document.getElementById('modal-regen-btn').style.display='';
  document.getElementById('modal-approve-btn').onclick = () => approveScript();

  const statusCol = isIdea ? (p==='youtube'?'status':cfg.statusCol) : cfg.statusCol;
  const status = item[statusCol]||'pending';
  document.getElementById('modal-status-note').textContent = `status: ${STATUS_LABELS[status]||status}`;
  document.getElementById('modal-approve-btn').textContent = status==='script_ready'?'✓ Approve Script':'✓ Approved ✅';
  document.getElementById('modal-approve-btn').disabled = status==='script_approved';

  switchModalLang(lang);
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function formatXThread(script) {
  const tweets = script.split('\n\n').filter(Boolean);
  if (!tweets.length) return `<div class="script-text">${script}</div>`;
  return `<div class="x-thread-preview">${tweets.map((t,i)=>`
    <div class="x-tweet">
      <div class="x-tweet-num">Tweet ${i+1} of ${tweets.length}</div>
      ${t}
    </div>`).join('')}</div>`;
}

function switchModalLang(l) {
  modalLang = l;
  document.getElementById('modal-script-ta').style.display = l==='ta'?'block':'none';
  document.getElementById('modal-script-en').style.display = l==='en'?'block':'none';
  document.getElementById('mtab-ta').className = 'modal-lang-tab'+(l==='ta'?' active-ta':'');
  document.getElementById('mtab-en').className = 'modal-lang-tab'+(l==='en'?' active-en':'');
}

function closeModal(event) {
  if (event && event.target!==document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow=''; modalEp=null;
}

function openRegen() {
  document.getElementById(`regen-${modalLang}`)?.classList.toggle('open');
}
function toggleRegen(l) {
  document.getElementById(`regen-${l}`)?.classList.remove('open');
}

async function approveScript() {
  if (!modalEp) return;
  const isIdea = !!modalEp.title && !modalEp.episode_number;
  const n = isIdea ? modalEp.id : modalEp.episode_number;
  await quickApprove(n,'script_approved',isIdea);
  closeModal();
}

async function submitRegen(l) {
  if (!modalEp) return;
  const note = document.getElementById(`regen-note-${l}`)?.value.trim();
  if (!note) { showToast('Please enter a note','error'); return; }
  const isIdea = !modalEp.episode_number;
  const n = isIdea ? modalEp.id : modalEp.episode_number;
  try {
    const table = l==='ta'?'tamil_episodes':'english_episodes';
    if (!isIdea) {
      await patchTable(table,n,{regenerate_note:note,status:'pending',[PLATFORMS[modalPlatform].scriptColTa]:null});
    }
    await fetch(EDGE_FN,{method:'POST',headers:EDGE_H,body:JSON.stringify({episode_number:n})});
    showToast(`Queued for regeneration`,'success');
    closeModal(); load();
  } catch(e) { showToast(`Error: ${e.message}`,'error'); }
}

// ── Images Modal ──────────────────────────────────────────────
function openImagesModal(n, isIdea=false, orientation='landscape') {
  const item = isIdea ? ideas.find(i=>i.id===n) : episodes.find(e=>e.episode_number===n);
  if (!item) return;
  let imageData = [];
  try {
    const src = orientation==='vertical' ? item.image_urls_vertical : item.image_urls;
    imageData = typeof src==='string' ? JSON.parse(src) : (src||[]);
  } catch(e) {}

  const imgHtml = imageData.map((img,i)=>`
    <div style="margin-bottom:24px;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;overflow:hidden">
      <div style="padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)">
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)">Scene ${img.id||i+1}</span>
        <span style="font-size:12px;font-weight:600;color:var(--text)">${img.label||''}</span>
      </div>
      <img src="${img.url}" style="width:100%;display:block" loading="lazy"/>
    </div>`).join('');

  const title = isIdea ? item.title : item.title_tamil;
  document.getElementById('modal-ep-num').textContent = isIdea?'Idea · Images':`Episode ${n} · Images`;
  document.getElementById('modal-title').textContent  = '🖼 Image Review';
  document.getElementById('modal-subtitle').textContent = title;
  document.getElementById('modal-lang-tabs').style.display='none';
  document.getElementById('modal-script-ta').style.display='block';
  document.getElementById('modal-script-en').style.display='none';
  document.getElementById('script-content-ta').innerHTML = imgHtml||'<div class="script-empty">No images yet</div>';
  document.getElementById('script-content-ta').className='';
  document.getElementById('script-content-ta').style.cssText='white-space:normal;background:none;border:none;padding:0';
  document.getElementById('modal-approve-btn').style.display='';
  document.getElementById('modal-regen-btn').style.display='none';
  document.getElementById('modal-approve-btn').textContent='✓ Approve Images';
  document.getElementById('modal-approve-btn').disabled=false;
  document.getElementById('modal-approve-btn').onclick=()=>{ closeModal(); quickApprove(n,'images_approved',isIdea); };
  document.getElementById('modal-status-note').textContent=`${orientation} images`;
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow='hidden';
}

// ── Supabase helpers ──────────────────────────────────────────
async function patchEpisode(n,data) { return patchTable(TABLE(),n,data); }
async function patchTable(table,n,data) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?episode_number=eq.${n}`,{
    method:'PATCH',headers:{...H,'Prefer':'return=minimal'},body:JSON.stringify(data)
  });
  if (!r.ok) throw new Error(`Supabase ${r.status}`);
}
async function patchIdea(id,data) {
  const r = await fetch(`${SB_URL}/rest/v1/ideas?id=eq.${id}`,{
    method:'PATCH',headers:{...H,'Prefer':'return=minimal'},body:JSON.stringify(data)
  });
  if (!r.ok) throw new Error(`Supabase ${r.status}`);
}

// ── Utilities ─────────────────────────────────────────────────
function showLoader(on) { document.getElementById('loadbar').classList.toggle('show',on); }
function showToast(msg,type='info') {
  const t=document.getElementById('toast');
  t.textContent=msg; t.className=`toast ${type}`;
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3500);
}
document.addEventListener('keydown',e=>{
  if (e.key==='Escape') { closeModal(); closeIdeaModal(); closeXModal(); }
});

// ── Init ──────────────────────────────────────────────────────
updateFilterPills();
load();
setInterval(load,60000);
</script>
