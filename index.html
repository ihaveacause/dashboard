<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Have a Cause — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:#080a0f;--surface:#0f1218;--surface2:#161b24;--surface3:#1c2230;
  --border:#1e2535;--border2:#252d40;--text:#dde3f0;--muted:#5a6480;--muted2:#8892aa;
  --accent:#e8412a;--accent2:#ff6b4a;
  --ta:#f59e0b;--ta-dim:rgba(245,158,11,.12);
  --en:#3b82f6;--en-dim:rgba(59,130,246,.12);
  --green:#10b981;--green-dim:rgba(16,185,129,.12);
  --purple:#8b5cf6;--purple-dim:rgba(139,92,246,.12);
  --teal:#14b8a6;--teal-dim:rgba(20,184,166,.12);
  --yellow:#f59e0b;--orange:#f97316;--orange-dim:rgba(249,115,22,.12);
  --blue:#3b82f6;--blue-dim:rgba(59,130,246,.12);
  --red:#ef4444;--red-dim:rgba(239,68,68,.12);
  --yt:#ff3333;--yt-dim:rgba(255,51,51,.1);
  --stats:#22d3ee;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* Topbar */
.topbar{display:flex;align-items:center;padding:0 28px;height:56px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:300;gap:0}
.logo{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:-.3px;margin-right:36px;white-space:nowrap}
.logo em{color:var(--accent);font-style:normal}
.l1-nav{display:flex;gap:2px;flex:1}
.l1-btn{padding:0 20px;height:56px;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;border:none;background:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;margin-bottom:-1px}
.l1-btn:hover{color:var(--text)}
.l1-btn.active-series{color:var(--text);border-bottom-color:var(--text)}
.l1-btn.active-stats{color:var(--stats);border-bottom-color:var(--stats)}

/* Platform bar */
.platbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;position:sticky;top:56px;z-index:299}
.platbar.hidden{display:none}
.ptab{display:inline-flex;align-items:center;gap:7px;padding:0 18px;height:42px;font-family:'Syne',sans-serif;font-size:13px;font-weight:600;color:var(--muted);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;margin-bottom:-1px}
.ptab.active{color:var(--yt);border-bottom-color:var(--yt)}

/* Filter bar */
.filterbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;position:sticky;top:98px;z-index:298}
.filterbar.hidden{display:none}
.filter-row{display:flex;gap:4px;padding:9px 0;overflow-x:auto;scrollbar-width:none;align-items:center;flex-wrap:wrap}
.filter-row::-webkit-scrollbar{display:none}
.lang-toggle{display:flex;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:3px;gap:3px;flex-shrink:0}
.lang-btn{padding:5px 16px;border-radius:7px;border:none;background:transparent;color:var(--muted2);font-family:'Syne',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.lang-btn.ta{background:var(--ta-dim);color:var(--ta);border:1px solid rgba(245,158,11,.25)}
.lang-btn.en{background:var(--en-dim);color:var(--en);border:1px solid rgba(59,130,246,.25)}
.fdiv{width:1px;height:20px;background:var(--border2);margin:0 8px;flex-shrink:0}
.fpill{padding:5px 14px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--muted);font-family:'Inter',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap}
.fpill:hover{color:var(--text);border-color:var(--border2)}
.fpill.active{background:var(--accent);color:white;border-color:var(--accent)}

/* Main */
.main{padding:24px 28px;max-width:1100px;margin:0 auto}

/* Cards */
.ep-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:12px;transition:border-color .2s,transform .15s}
.ep-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.ep-card.lang-ta{border-left:3px solid var(--ta)}
.ep-card.lang-en{border-left:3px solid var(--en)}
.ep-card.published{opacity:.8}
.ep-head{padding:16px 18px 12px;display:flex;align-items:flex-start;gap:12px}
.ep-num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:3px 8px;flex-shrink:0;margin-top:2px}
.ep-body{flex:1;min-width:0}
.ep-meta{display:flex;align-items:center;gap:6px;margin-bottom:7px;flex-wrap:wrap}
.ep-lang{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px}
.ep-lang.ta{background:var(--ta-dim);color:var(--ta)}
.ep-lang.en{background:var(--en-dim);color:var(--en)}
.mod-badge{font-family:'JetBrains Mono',monospace;font-size:9px;padding:2px 7px;border-radius:4px;background:var(--surface2);color:var(--muted2)}
.status-badge{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;padding:2px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.5px;margin-left:auto}
.sb-pending{background:rgba(90,100,128,.15);color:var(--muted2)}
.sb-generating,.sb-generating_images,.sb-generating_video{background:var(--orange-dim);color:var(--orange)}
.sb-script_ready{background:var(--blue-dim);color:var(--blue)}
.sb-script_approved{background:rgba(245,158,11,.12);color:var(--yellow)}
.sb-images_ready{background:var(--purple-dim);color:var(--purple)}
.sb-images_approved{background:var(--purple-dim);color:var(--purple)}
.sb-voice_uploaded{background:var(--ta-dim);color:var(--ta)}
.sb-voice_approved{background:var(--green-dim);color:var(--green)}
.sb-video_ready{background:var(--teal-dim);color:var(--teal)}
.sb-video_approved{background:var(--green-dim);color:var(--green)}
.sb-published{background:rgba(232,65,42,.12);color:var(--accent2)}
.ep-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;line-height:1.5;color:var(--text);margin-bottom:2px}
.ep-sub{font-size:12px;color:var(--muted2);line-height:1.4;margin-bottom:4px}
.ep-bridge{font-size:11px;color:var(--muted);font-style:italic;line-height:1.4}
.ep-actions{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Buttons */
.btn{padding:7px 16px;border-radius:8px;font-size:12px;font-weight:600;font-family:'Inter',sans-serif;border:1px solid transparent;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-gen{background:var(--accent);color:white;border-color:var(--accent)}
.btn-review{background:var(--blue-dim);color:var(--blue);border-color:rgba(59,130,246,.3)}
.btn-approve{background:var(--green-dim);color:var(--green);border-color:rgba(16,185,129,.3)}
.btn-regen{background:var(--surface2);color:var(--muted2);border-color:var(--border2)}
.btn-upload{background:var(--ta-dim);color:var(--ta);border-color:rgba(245,158,11,.3)}
.btn-preview{background:var(--teal-dim);color:var(--teal);border-color:rgba(20,184,166,.3)}
.btn-yt{background:var(--yt-dim);color:var(--yt);border-color:rgba(255,51,51,.3)}
.btn-listen{background:var(--purple-dim);color:var(--purple);border-color:rgba(139,92,246,.3)}
.spin{display:inline-block;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wait-msg{font-size:12px;color:var(--muted2);font-family:'JetBrains Mono',monospace}

/* Upload section (YouTube images) */
.upload-section{padding:14px 18px;border-top:1px solid var(--border);background:var(--surface2)}
.upload-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.upload-slot{border:1px dashed var(--border2);border-radius:10px;padding:12px;text-align:center;cursor:pointer;transition:all .2s;position:relative}
.upload-slot:hover{border-color:var(--accent);background:rgba(232,65,42,.05)}
.upload-slot.has-file{border-color:var(--green);border-style:solid;background:var(--green-dim)}
.upload-slot-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.upload-slot-icon{font-size:22px;margin-bottom:4px}
.upload-slot-status{font-size:11px;color:var(--muted)}
.upload-slot.has-file .upload-slot-status{color:var(--green)}
.upload-input{display:none}
/* Episode images panel */
.ep-img-panel{padding:16px 18px;border-top:1px solid var(--border);background:var(--surface2)}
.ep-img-panel-title{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.img-upload-row{display:grid;grid-template-columns:160px 1fr 32px;gap:10px;align-items:start;margin-bottom:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.img-upload-row.saved{border-color:var(--green)}
.img-thumb{width:140px;height:80px;object-fit:cover;border-radius:7px;display:block;background:var(--surface2);border:1px solid var(--border2)}
.img-thumb-placeholder{width:140px;height:80px;border-radius:7px;border:1px dashed var(--border2);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;background:var(--surface2);transition:all .2s}
.img-thumb-placeholder:hover{border-color:var(--accent);background:rgba(232,65,42,.05)}
.img-row-right{display:flex;flex-direction:column;gap:6px}
.img-trigger-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.4px}
.img-trigger-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-family:'Inter',sans-serif;font-size:12px;padding:7px 10px;outline:none;transition:border-color .2s}
.img-trigger-input:focus{border-color:var(--accent)}
.img-trigger-hint{font-size:11px;color:var(--muted);font-style:italic}
.img-del-btn{background:var(--red-dim);border:1px solid rgba(239,68,68,.3);color:var(--red);border-radius:7px;width:28px;height:28px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;margin-top:4px}
.img-del-btn:hover{opacity:.7}
.img-order-badge{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);margin-bottom:4px}
.img-saved-badge{font-size:10px;color:var(--green);font-family:'JetBrains Mono',monospace}

/* Bucket label */
.bucket{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:var(--muted);letter-spacing:1px;text-transform:uppercase;padding:18px 0 10px}
.bucket:first-child{padding-top:0}
.ep-grid{display:grid;gap:0}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:18px;width:100%;max-width:880px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;animation:mIn .25s ease}
.modal.sm{max-width:520px}
@keyframes mIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px}
.modal-info{flex:1}
.modal-ep{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:4px}
.modal-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:700}
.modal-sub{font-size:12px;color:var(--muted2);margin-top:3px}
.modal-close{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;color:var(--muted2);width:32px;height:32px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.modal-close:hover{color:var(--text)}
.modal-lang-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 24px}
.mltab{padding:10px 18px;font-size:13px;font-weight:600;color:var(--muted);border:none;border-bottom:2px solid transparent;background:none;cursor:pointer;transition:all .2s;margin-bottom:-1px}
.mltab.ta{color:var(--ta);border-bottom-color:var(--ta)}
.mltab.en{color:var(--en);border-bottom-color:var(--en)}
.modal-body{flex:1;overflow-y:auto;padding:24px;scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
.script-text{font-size:14px;line-height:1.85;color:var(--text);white-space:pre-wrap;font-family:'Inter',sans-serif;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:20px}
.modal-foot{padding:14px 24px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.modal-note{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-left:auto}
.img-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.img-item{border-radius:10px;overflow:hidden;border:1px solid var(--border2)}
.img-item img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}
.img-label{padding:6px 10px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);border-top:1px solid var(--border)}
.regen-box{margin-top:16px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px;display:none}
.regen-box.open{display:block}
.regen-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.regen-ta{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:10px;resize:vertical;min-height:70px;outline:none;transition:border-color .2s}
.regen-ta:focus{border-color:var(--accent)}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 18px}
.stat-val{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:500;line-height:1;margin-bottom:4px}
.stat-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-family:'JetBrains Mono',monospace;margin-bottom:10px}
.stat-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:2px;transition:width .6s ease}
.pipeline-panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
.pp-title{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:14px}
.pp-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.pp-row:last-child{border-bottom:none}
.pp-num{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500}
.progress-big{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-top:12px}
.pb-bar{height:8px;background:var(--border);border-radius:4px;margin:12px 0 6px;overflow:hidden}
.pb-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;transition:width .8s ease}
.pb-labels{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}

/* Toast */
.toast{position:fixed;bottom:28px;right:28px;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:12px 18px;font-size:13px;font-family:'JetBrains Mono',monospace;color:var(--text);z-index:9999;transform:translateY(80px);opacity:0;transition:all .3s;max-width:340px}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-color:rgba(16,185,129,.4);color:var(--green)}
.toast.error{border-color:rgba(239,68,68,.4);color:var(--red)}
.toast.info{border-color:rgba(59,130,246,.4);color:var(--blue)}
.loading-bar{height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));background-size:200%;animation:lb 1.2s ease infinite;position:fixed;top:0;left:0;right:0;z-index:9999;display:none}
.loading-bar.show{display:block}
@keyframes lb{0%{background-position:100% 0}100%{background-position:-100% 0}}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty div{font-size:36px;margin-bottom:10px}
.empty p{font-size:14px;font-family:'JetBrains Mono',monospace}
</style>
</head>
<body>
<div class="loading-bar" id="lb"></div>

<!-- Topbar -->
<div class="topbar">
  <div class="logo">I Have A <em>Cause</em></div>
  <nav class="l1-nav">
    <button class="l1-btn" id="l1-stats" onclick="setL1('stats')">Channel Stats</button>
    <button class="l1-btn active-series" id="l1-series" onclick="setL1('series')">Series</button>
  </nav>
</div>

<!-- Platform bar -->
<div class="platbar" id="platbar">
  <button class="ptab active" id="pt-yt">▶ YouTube Long</button>
</div>

<!-- Filter bar -->
<div class="filterbar" id="filterbar">
  <div class="filter-row" id="filter-row">
    <div class="lang-toggle">
      <button class="lang-btn ta" id="btn-ta" onclick="setLang('ta')">🇮🇳 Tamil</button>
      <button class="lang-btn" id="btn-en" onclick="setLang('en')">🇬🇧 English</button>
    </div>
    <div class="fdiv"></div>
    <button class="fpill active" onclick="setFilter('all',this)">All</button>
    <button class="fpill" onclick="setFilter('pending',this)">Pending</button>
    <button class="fpill" onclick="setFilter('script_ready',this)">Script Ready</button>
    <button class="fpill" onclick="setFilter('script_approved',this)">Script Approved</button>
    <button class="fpill" onclick="setFilter('voice_uploaded',this)">Voice Uploaded</button>
    <button class="fpill" onclick="setFilter('voice_approved',this)">Voice Approved</button>
    <button class="fpill" onclick="setFilter('video_ready',this)">Video Ready</button>
    <button class="fpill" onclick="setFilter('video_approved',this)">Video Approved</button>
    <button class="fpill" onclick="setFilter('published',this)">Published</button>
  </div>
</div>

<!-- Main -->
<div class="main" id="main">
  <div class="empty"><div>🌀</div><p>Loading...</p></div>
</div>

<!-- Script Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeMod(event)">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-info">
        <div class="modal-ep" id="mod-ep">—</div>
        <div class="modal-title" id="mod-title">—</div>
        <div class="modal-sub" id="mod-sub">—</div>
      </div>
      <button class="modal-close" onclick="closeMod()">✕</button>
    </div>
    <div class="modal-body">
      <div class="script-text" id="mod-script"></div>
      <div class="regen-box" id="regen-box">
        <div class="regen-label">Regeneration note</div>
        <textarea class="regen-ta" id="regen-note" placeholder="Describe what to change..."></textarea>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn btn-gen" onclick="submitRegen()">⚡ Regenerate</button>
          <button class="btn btn-regen" onclick="toggleRegen()">Cancel</button>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-approve" id="mod-approve-btn" onclick="approveScript()">✓ Approve Script</button>
      <button class="btn btn-regen" onclick="toggleRegen()">↺ Request Regeneration</button>
      <span class="modal-note" id="mod-note"></span>
    </div>
  </div>
</div>

<!-- Images Modal -->
<div class="modal-overlay" id="img-modal-overlay" onclick="closeImgMod(event)">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-info">
        <div class="modal-ep" id="img-mod-ep">—</div>
        <div class="modal-title">🖼 Image Review</div>
        <div class="modal-sub" id="img-mod-sub">5 AI-generated scenes</div>
      </div>
      <button class="modal-close" onclick="closeImgMod()">✕</button>
    </div>
    <div class="modal-body">
      <div class="img-grid" id="img-grid"></div>
      <div class="regen-box" id="img-regen-box">
        <div class="regen-label">Regenerate specific scene</div>
        <textarea class="regen-ta" id="img-regen-note" placeholder='e.g. "Regenerate scene 3: show a Tamil grandmother in a temple courtyard at dawn"'></textarea>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn btn-gen" onclick="submitImgRegen()">⚡ Regenerate</button>
          <button class="btn btn-regen" onclick="toggleImgRegen()">Cancel</button>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-approve" onclick="approveImages()">✓ Approve Images</button>
      <button class="btn btn-regen" onclick="toggleImgRegen()">↺ Regenerate a Scene</button>
      <span class="modal-note" id="img-mod-note"></span>

function render() {

// ── Episode Image Manager ─────────────────────────────────────
// State: 'upload' | 'preview'
// No auto-refresh. No auto-save. User controls everything.

const epImgStore = {};  // {`${n}_${lang}`: [{order, file, url, trigger, filename}]}
function epImgKey(n) { return `${n}_${lang}`; }
function getStore(n) {
  const key = epImgKey(n);
  if (!epImgStore[key]) epImgStore[key] = [];
  return epImgStore[key];
}

// ── Build the upload/preview section ─────────────────────────
function buildYtImagesSection(ep, n) {
  let saved = ep.episode_images || [];
  if (typeof saved === 'string') { try { saved = JSON.parse(saved); } catch(e) { saved = []; } }

  // Pre-populate store from DB on first render (if store is empty)
  const key = epImgKey(n);
  if (!epImgStore[key] && saved.length) {
    epImgStore[key] = saved.map(img => ({...img, file: null}));
  }

  const hasImages = saved.length > 0;
  const genDisabled = !hasImages;

  return `<div class="ep-img-panel" id="img-panel-${n}">
    <div id="img-view-${n}">
      ${renderUploadView(n, saved)}
    </div>
    <div style="height:1px;background:var(--border);margin:14px 0"></div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn btn-gen" id="gen-btn-${n}"
        onclick="triggerVideo(${n},'${lang}')"
        ${genDisabled ? 'disabled' : ''}>🎬 Generate Video</button>
      <span id="gen-status-${n}" style="font-size:11px;font-family:monospace;color:${hasImages?'var(--green)':'var(--red)'}">
        ${hasImages ? saved.length+' images saved — ready' : 'Save images first'}
      </span>
    </div>
  </div>`;
}

function renderUploadView(n, existing) {
  const store = getStore(n);
  // Merge existing saved with store
  if (store.length === 0 && existing.length > 0) {
    existing.forEach(img => store.push({...img, file: null}));
  }

  const slots = store.length > 0
    ? store.map((item, i) => renderSlot(n, i+1, item)).join('')
    : renderSlot(n, 1, null);

  return `
    <div class="ep-img-panel-title">
      Episode images — upload in order, set trigger lines, then Save all
    </div>
    <div id="img-slots-${n}">${slots}</div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center">
      <button class="btn btn-regen" onclick="addImgSlot(${n})">+ Add image</button>
      <button class="btn btn-approve" id="save-btn-${n}"
        onclick="saveAllImages(${n},'${lang}')">💾 Save all</button>
      <span id="save-status-${n}" style="font-size:11px;font-family:monospace;color:var(--muted)"></span>
    </div>`;
}

function renderSlot(n, order, item) {
  const hasFile  = item?.file != null;
  const hasUrl   = item?.url != null;
  const trigger  = item?.trigger || '';
  const filename = item?.filename || '';
  const imgSrc   = item?._localSrc || item?.url || '';
  const isFirst  = order === 1;

  return `
  <div class="img-upload-row ${hasUrl||hasFile?'saved':''}" id="img-slot-${n}-${order}" data-order="${order}">
    <div>
      <div class="img-order-badge" id="badge-${n}-${order}">
        Image ${order}${hasUrl?' <span class="img-saved-badge">✓</span>':''}
      </div>
      <label style="cursor:pointer" title="Click to select or change image">
        ${imgSrc
          ? `<img class="img-thumb" src="${imgSrc}" id="img-preview-${n}-${order}"
               style="cursor:pointer" onclick="this.nextElementSibling.click()"/>`
          : `<div class="img-thumb-placeholder" id="img-preview-${n}-${order}">🖼<br>
               <span style="font-size:10px;color:var(--muted)">click to select</span></div>`}
        <input type="file" accept="image/*" style="display:none"
          onchange="selectImg(${n},${order},this)">
      </label>
    </div>
    <div class="img-row-right">
      <div class="img-trigger-label">
        ${isFirst ? 'Trigger line — leave blank, plays from the very start'
                  : 'Trigger line — first words of the paragraph where this image should appear'}
      </div>
      <input class="img-trigger-input" id="trigger-${n}-${order}"
        value="${trigger.replace(/"/g,'&quot;')}"
        placeholder="${isFirst ? 'Leave blank — plays from start of video'
                                : 'e.g. Many of us when we hear the word...'}">
      <div class="img-trigger-hint">
        ${isFirst ? '↳ this image plays from the very beginning'
                  : '↳ WhisperX finds this line in voice recording and switches image exactly then'}
      </div>
    </div>
    <button class="img-del-btn" onclick="removeSlot(${n},${order})" title="Remove">✕</button>
  </div>`;
}

function renderPreviewView(n, results) {
  const rows = results.map((img, i) => `
    <div style="display:grid;grid-template-columns:180px 1fr;gap:12px;background:var(--surface2);
         border:1px solid var(--border2);border-radius:10px;overflow:hidden;margin-bottom:10px">
      <img src="${img.url}" style="width:180px;height:101px;object-fit:cover;display:block"/>
      <div style="padding:12px 14px">
        <div style="font-family:monospace;font-size:10px;color:var(--muted);margin-bottom:6px">
          IMAGE ${img.order}
        </div>
        <div style="font-size:13px;color:var(--text);margin-bottom:4px">
          ${img.trigger
            ? `<span style="color:var(--green)">↳</span> When spoken: "<strong>${img.trigger}</strong>"`
            : `<span style="color:var(--muted2)">Plays from the very start of the video</span>`}
        </div>
        <div style="font-size:11px;color:var(--muted);font-family:monospace">${img.filename||''}</div>
      </div>
    </div>`).join('');

  return `
    <div style="font-family:monospace;font-size:10px;color:var(--muted2);text-transform:uppercase;
         letter-spacing:.5px;margin-bottom:12px">Preview — ${results.length} images</div>
    ${rows}
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="btn btn-approve" onclick="confirmImages(${n},'${lang}')">
        ✓ Looks good — proceed to Generate Video
      </button>
      <button class="btn btn-regen" onclick="backToEdit(${n})">
        ← Edit images
      </button>
    </div>`;
}

// ── Slot management ───────────────────────────────────────────
let slotCounters = {};

// Sync all trigger inputs from DOM → store before any re-render
function syncTriggers(n) {
  const store = getStore(n);
  store.forEach(item => {
    const el = document.getElementById(`trigger-${n}-${item.order}`);
    if (el) item.trigger = el.value.trim();
  });
}

function addImgSlot(n) {
  syncTriggers(n);  // save current trigger values before DOM changes
  const store = getStore(n);
  const order = store.length + 1;
  store.push({order, file: null, url: null, trigger: '', filename: ''});
  const container = document.getElementById(`img-slots-${n}`);
  if (container) container.insertAdjacentHTML('beforeend', renderSlot(n, order, store[order-1]));
}

function removeSlot(n, order) {
  syncTriggers(n);  // save current trigger values before re-render
  const store = getStore(n);
  const idx = store.findIndex(i => i.order === order);
  if (idx >= 0) store.splice(idx, 1);
  // Re-number remaining
  store.forEach((item, i) => { item.order = i + 1; });
  // Re-render slots — trigger values are now in store so they will persist
  const container = document.getElementById(`img-slots-${n}`);
  if (container) container.innerHTML = store.map((item,i) => renderSlot(n, i+1, item)).join('');
}

function selectImg(n, order, input) {
  const file = input.files[0];
  if (!file) return;
  const store = getStore(n);
  let item = store.find(i => i.order === order);
  if (!item) { item = {order, file:null, url:null, trigger:'', filename:''}; store.push(item); }

  item.file     = file;
  item.filename = file.name;

  // Show preview locally
  const reader = new FileReader();
  reader.onload = e => {
    item._localSrc = e.target.result;
    const slot = document.getElementById(`img-slot-${n}-${order}`);
    if (!slot) return;
    const previewEl = document.getElementById(`img-preview-${n}-${order}`);
    if (previewEl) {
      if (previewEl.tagName === 'IMG') {
        previewEl.src = e.target.result;
      } else {
        // Replace placeholder div with img
        previewEl.outerHTML = `<img class="img-thumb" src="${e.target.result}"
          id="img-preview-${n}-${order}" style="cursor:pointer"
          onclick="this.nextElementSibling.click()"/>`;
      }
    }
    const badge = document.getElementById(`badge-${n}-${order}`);
    if (badge) badge.innerHTML = `Image ${order} <span style="color:var(--orange)">● ready</span>`;
    slot.classList.add('saved');
  };
  reader.readAsDataURL(file);
}

// ── Save all ──────────────────────────────────────────────────
async function saveAllImages(n, language) {
  const saveBtn    = document.getElementById(`save-btn-${n}`);
  const saveStatus = document.getElementById(`save-status-${n}`);

  // Sync ALL trigger lines from DOM to store before saving
  syncTriggers(n);
  const store = getStore(n);

  const toSave = store.filter(i => i.file || i.url);
  if (!toSave.length) { showToast('Add at least one image first','error'); return; }

  if (saveBtn) { saveBtn.disabled=true; saveBtn.textContent='⏳ Saving...'; }
  if (saveStatus) { saveStatus.textContent='Uploading...'; saveStatus.style.color='var(--orange)'; }

  try {
    const results = [];
    for (const item of toSave) {
      // Upload new file if selected
      if (item.file) {
        const ext  = item.file.name.split('.').pop().toLowerCase();
        const path = `ep${String(n).padStart(3,'0')}/${language}/ep_img_${item.order}.${ext}`;
        if (saveStatus) saveStatus.textContent = `Uploading image ${item.order}...`;
        const resp = await fetch(`${SB_URL}/storage/v1/object/episode-images/${path}`, {
          method:'POST',
          headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,
                   'Content-Type':item.file.type||'image/jpeg','x-upsert':'true'},
          body: item.file
        });
        if (!resp.ok) {
          const err = await resp.text();
          throw new Error(`Image ${item.order} upload failed (${resp.status}): ${err.slice(0,100)}`);
        }
        item.url      = `${SB_URL}/storage/v1/object/public/episode-images/${path}`;
        item.file     = null;
        item.filename = item.filename || path.split('/').pop();
      }
      if (item.url) {
        results.push({order:item.order, url:item.url, trigger:item.trigger||'', filename:item.filename||''});
      }
    }

    if (!results.length) throw new Error('No images uploaded successfully');

    // Save to DB
    const table = language === 'en' ? 'english_episodes' : 'tamil_episodes';
    const dbResp = await fetch(`${SB_URL}/rest/v1/${table}?episode_number=eq.${n}`, {
      method:'PATCH',
      headers:{...H,'Prefer':'return=minimal'},
      body: JSON.stringify({episode_images: results})
    });
    if (!dbResp.ok) {
      const err = await dbResp.text();
      throw new Error(`DB save failed (${dbResp.status}): ${err.slice(0,150)}`);
    }

    // Update local episodes array (no re-render)
    const epIdx = episodes.findIndex(e => e.episode_number === n);
    if (epIdx >= 0) episodes[epIdx].episode_images = results;

    // Show preview — no page reload
    showPreview(n, results);
    showToast(`✅ ${results.length} images saved`, 'success');

  } catch(e) {
    console.error('saveAllImages:', e);
    showToast(`Save failed: ${e.message}`, 'error');
    if (saveStatus) { saveStatus.textContent=`Error: ${e.message.slice(0,60)}`; saveStatus.style.color='var(--red)'; }
    if (saveBtn) { saveBtn.disabled=false; saveBtn.textContent='💾 Save all'; }
  }
}

function showPreview(n, results) {
  const view = document.getElementById(`img-view-${n}`);
  if (!view) return;
  view.innerHTML = renderPreviewView(n, results);
  // Enable generate video button
  const genBtn    = document.getElementById(`gen-btn-${n}`);
  const genStatus = document.getElementById(`gen-status-${n}`);
  if (genBtn)    genBtn.disabled = false;
  if (genStatus) { genStatus.textContent=`${results.length} images saved — ready`; genStatus.style.color='var(--green)'; }
}

function confirmImages(n, language) {
  // User confirmed preview — just close preview, generate video button is already enabled
  const view = document.getElementById(`img-view-${n}`);
  const ep   = episodes.find(e => e.episode_number === n);
  let saved  = ep?.episode_images || [];
  if (typeof saved === 'string') { try { saved = JSON.parse(saved); } catch(e) { saved=[]; } }
  if (view) view.innerHTML = `
    <div style="font-family:monospace;font-size:11px;color:var(--green);padding:10px 0">
      ✓ ${saved.length} images confirmed — click Generate Video below
    </div>`;
}

function backToEdit(n) {
  const view = document.getElementById(`img-view-${n}`);
  const ep   = episodes.find(e => e.episode_number === n);
  let saved  = ep?.episode_images || [];
  if (typeof saved === 'string') { try { saved = JSON.parse(saved); } catch(e) { saved=[]; } }
  // Reset store to saved state — trigger lines come from DB saved data
  epImgStore[epImgKey(n)] = saved.map(img => ({...img, file:null}));
  if (view) view.innerHTML = renderUploadView(n, saved);
}

// ── Actions ────────────────────────────────────────────────
async function triggerScript(n, language=lang) {
  const card = document.getElementById(`card-${n}`);
  const btn  = card?.querySelector('.btn-gen');
  if (btn) { btn.disabled=true; btn.textContent='⚙️ Triggering...'; }
  try {
    const r = await fetch(EDGE.script, {
      method:'POST', headers:H,
      body: JSON.stringify({episode_number:n, language})
    });
    const d = await r.json();
    if (d.success) {
      await patch(n, {status:'generating'});
      showToast(`Episode ${n} script generating...`,'success');
      setTimeout(loadEpisodes, 1500);
    } else throw new Error(d.error||'Edge function error');
  } catch(e) {
    showToast(`Error: ${e.message}`,'error');
    if (btn) { btn.disabled=false; btn.textContent='⚡ Generate Script'; }
  }
}

async function triggerImages(n, language=lang) {
  try {
    const r = await fetch(EDGE.images, {
      method:'POST', headers:H,
      body: JSON.stringify({episode_number:n, language})
    });
    const d = await r.json();
    if (d.success) {
      await patch(n, {status:'generating_images'});
      showToast(`Image generation started — ~20 min`,'success');
      setTimeout(loadEpisodes, 1500);
    } else throw new Error(d.error||'Edge function error');
  } catch(e) { showToast(`Error: ${e.message}`,'error'); }
}

async function triggerVideo(n, language=lang) {
  try {
    const r = await fetch(EDGE.video, {
      method:'POST', headers:H,
      body: JSON.stringify({episode_number:n, language})
    });
    const d = await r.json();
    if (d.success) {
      await patch(n, {status:'generating_video'});
      showToast(`Video rendering started — ~30 min`,'success');
      setTimeout(loadEpisodes, 1500);
    } else throw new Error(d.error||'Edge function error');
  } catch(e) { showToast(`Error: ${e.message}`,'error'); }

async function triggerYouTube(n) {
  try {
    const r = await fetch(EDGE.yt, {
      method:'POST', headers:H,
      body: JSON.stringify({episode_number:n})
    });
    const d = await r.json();
    if (d.success) {
      showToast(`YouTube upload triggered`,'success');
      setTimeout(loadEpisodes, 2000);
    } else throw new Error(d.error||'Edge function error');
  } catch(e) { showToast(`Error: ${e.message}`,'error'); }

async function quickSet(n, status) {
  try {
    await patch(n, {status});
    showToast(`Episode ${n} → ${STATUS_LABELS[status]}`,'success');
    loadEpisodes();
  } catch(e) { showToast(`Error: ${e.message}`,'error'); }
}

async function uploadVoice(n, input) {
  const file = input.files[0];
  if (!file) return;
  const btn = input.closest('.btn-upload, .btn-regen');
  if (btn) { btn.textContent = '⏳ Uploading...'; }
  try {
    const ext  = file.name.split('.').pop();
    const path = `ep${String(n).padStart(3,'0')}_${lang}.${ext}`;
    const vUpResp = await fetch(`${SB_URL}/storage/v1/object/episode-voices/${path}`, {
      method: 'POST',
      headers: {'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':file.type||'audio/mpeg','x-upsert':'true'},
      body: file
    });
    if (!vUpResp.ok) throw new Error(`Voice upload failed ${vUpResp.status}: ${await vUpResp.text()}`);
    const publicUrl = `${SB_URL}/storage/v1/object/public/episode-voices/${path}`;
    await patch(n, {voice_url: publicUrl, status: 'voice_uploaded'});
    showToast(`Voice uploaded successfully`,'success');
    loadEpisodes();
  } catch(e) {
    showToast(`Upload failed: ${e.message}`,'error');
    if (btn) btn.textContent = btn.classList.contains('btn-regen') ? '↺ Re-upload Voice' : '🎙 Upload Voice Recording';
  }
}

async function uploadYtImage(n, type, input) {
  const file = input.files[0];
  if (!file) return;
  const slot = input.closest('.upload-slot');
  if (slot) { slot.querySelector('.upload-slot-status').textContent = '⏳ Uploading...'; }
  try {
    const ext  = file.name.split('.').pop();
    const path = `ep${String(n).padStart(3,'0')}/yt_${type}.${ext}`;
    const iResp = await fetch(`${SB_URL}/storage/v1/object/episode-images/${path}`, {
      method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':file.type||'image/jpeg','x-upsert':'true'},
      body:file
    });
    if (!iResp.ok) throw new Error(`Image upload failed ${iResp.status}: ${await iResp.text()}`);
    const publicUrl = `${SB_URL}/storage/v1/object/public/episode-images/${path}`;
    const col = type === 'intro' ? 'intro_image_url' : 'outro_image_url';
    await patch(n, {[col]: publicUrl});
    if (slot) {
      slot.classList.add('has-file');
      slot.querySelector('.upload-slot-status').textContent = '✓ Custom uploaded';
    }
    showToast(`${type} image uploaded`,'success');
  } catch(e) {
    showToast(`Upload failed: ${e.message}`,'error');
    if (slot) slot.querySelector('.upload-slot-status').textContent = 'Upload failed — try again';
  }
}

// ── Script Modal ───────────────────────────────────────────
function openScriptMod(n) {
  const ep = episodes.find(e => e.episode_number === n);
  if (!ep) return;
  modalEp = ep;

  const scriptCol = lang === 'ta' ? 'script_tamil' : 'script_english';
  const script    = ep[scriptCol] || '';
  const title     = lang === 'ta' ? (ep.title_tamil||ep.title_english) : ep.title_english;
  const status    = ep.status || 'pending';

  document.getElementById('mod-ep').textContent     = `Episode ${n} · ${lang.toUpperCase()}`;
  document.getElementById('mod-title').textContent  = title||'';
  document.getElementById('mod-sub').textContent    = ep.bridge||'';
  document.getElementById('mod-script').textContent = script || '— Script not generated yet —';
  document.getElementById('mod-note').textContent   = `status: ${STATUS_LABELS[status]||status}`;

  const approveBtn = document.getElementById('mod-approve-btn');
  approveBtn.textContent = status === 'script_ready' ? '✓ Approve Script' : '✓ Approved ✅';
  approveBtn.disabled    = status === 'script_approved';

  document.getElementById('regen-box').classList.remove('open');
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeMod(event) {
  if (event && event.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
  modalEp = null;
}

function toggleRegen() {
  document.getElementById('regen-box').classList.toggle('open');
}

async function approveScript() {
  if (!modalEp) return;
  await quickSet(modalEp.episode_number, 'script_approved');
  closeMod();
}

async function submitRegen() {
  if (!modalEp) return;
  const note = document.getElementById('regen-note').value.trim();
  if (!note) { showToast('Please describe what to change','error'); return; }
  try {
    await patch(modalEp.episode_number, {regenerate_note: note, status: 'pending'});
    await triggerScript(modalEp.episode_number);
    closeMod();
  } catch(e) { showToast(`Error: ${e.message}`,'error'); }
}

// ── Images Modal ───────────────────────────────────────────
function openImgMod(n) {
  const ep = episodes.find(e => e.episode_number === n);
  if (!ep) return;
  imgModalEp = ep;

  let images = ep.image_urls || [];
  if (typeof images === 'string') { try { images = JSON.parse(images); } catch(e) { images = []; } }

  const html = images.map(img => `
    <div class="img-item">
      <img src="${img.url}" loading="lazy" alt="Scene ${img.id}"/>
      <div class="img-label">Scene ${img.id} — ${img.label||''}</div>
    </div>`).join('') || '<div style="color:var(--muted);text-align:center;padding:30px;font-family:var(--font-mono);font-size:13px">No images yet</div>';

  document.getElementById('img-mod-ep').textContent  = `Episode ${n} · ${lang.toUpperCase()}`;
  document.getElementById('img-mod-sub').textContent = `${images.length} scenes generated`;
  document.getElementById('img-grid').innerHTML      = html;
  document.getElementById('img-regen-box').classList.remove('open');
  document.getElementById('img-modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeImgMod(event) {
  if (event && event.target !== document.getElementById('img-modal-overlay')) return;
  document.getElementById('img-modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
  imgModalEp = null;
}

function toggleImgRegen() {
  document.getElementById('img-regen-box').classList.toggle('open');
}

async function approveImages() {
  if (!imgModalEp) return;
  await quickSet(imgModalEp.episode_number, 'images_approved');
  closeImgMod();
}

async function submitImgRegen() {
  if (!imgModalEp) return;
  const note = document.getElementById('img-regen-note').value.trim();
  if (!note) { showToast('Describe which scene to regenerate','error'); return; }
  try {
    await patch(imgModalEp.episode_number, {regenerate_note: note, status:'script_approved'});
    await triggerImages(imgModalEp.episode_number);
    closeImgMod();
  } catch(e) { showToast(`Error: ${e.message}`,'error'); }
}

// ── Stats ──────────────────────────────────────────────────
function renderStats(ta, en) {
  const cnt = (arr, s) => arr.filter(e => (e.status||'pending') === s).length;
  const pub_ta  = cnt(ta, 'published');
  const pub_en  = cnt(en, 'published');
  const pipe_ta = ta.filter(e => !['pending','published'].includes(e.status||'pending')).length;
  const total   = 200;

  const stageRows = ['script_ready','script_approved','images_ready','images_approved',
    'voice_uploaded','voice_approved','video_ready','video_approved']
    .map(s => `<div class="pp-row">
      <span style="color:var(--muted2)">${STATUS_LABELS[s]}</span>
      <span class="pp-num" style="color:var(--blue)">${cnt(ta,s)}</span>
    </div>`).join('');

  document.getElementById('main').innerHTML = `
  <div class="stats-grid">
    <div class="stat"><div class="stat-lbl">Tamil Published</div><div class="stat-val" style="color:var(--yt)">${pub_ta}</div><div class="stat-bar"><div class="stat-bar-fill" style="width:${Math.round(pub_ta/total*100)}%;background:var(--yt)"></div></div></div>
    <div class="stat"><div class="stat-lbl">English Published</div><div class="stat-val" style="color:var(--en)">${pub_en}</div><div class="stat-bar"><div class="stat-bar-fill" style="width:${Math.round(pub_en/total*100)}%;background:var(--en)"></div></div></div>
    <div class="stat"><div class="stat-lbl">In Pipeline</div><div class="stat-val" style="color:var(--orange)">${pipe_ta}</div><div class="stat-bar"><div class="stat-bar-fill" style="width:${Math.round(pipe_ta/total*100)}%;background:var(--orange)"></div></div></div>
    <div class="stat"><div class="stat-lbl">Total Pending</div><div class="stat-val" style="color:var(--muted)">${cnt(ta,'pending')}</div><div class="stat-bar"><div class="stat-bar-fill" style="width:${Math.round(cnt(ta,'pending')/total*100)}%;background:var(--muted)"></div></div></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <div class="pipeline-panel">
      <div class="pp-title">Tamil Pipeline Breakdown</div>
      ${stageRows}
      <div class="pp-row"><span style="color:var(--muted2)">Published</span><span class="pp-num" style="color:var(--green)">${pub_ta}</span></div>
    </div>
    <div class="pipeline-panel">
      <div class="pp-title">Channel Summary</div>
      <div class="pp-row"><span style="color:var(--muted2)">Tamil published</span><span class="pp-num" style="color:var(--yt)">${pub_ta} / ${total}</span></div>
      <div class="pp-row"><span style="color:var(--muted2)">English published</span><span class="pp-num" style="color:var(--en)">${pub_en} / ${total}</span></div>
      <div class="pp-row"><span style="color:var(--muted2)">Tamil in pipeline</span><span class="pp-num" style="color:var(--orange)">${pipe_ta}</span></div>
      <div class="pp-row"><span style="color:var(--muted2)">English in pipeline</span><span class="pp-num" style="color:var(--orange)">${en.filter(e=>!['pending','published'].includes(e.status||'pending')).length}</span></div>
    </div>
  </div>
  <div class="progress-big">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase">Series Progress — Tamil</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;color:var(--accent)">${pub_ta} / ${total} episodes published</span>
    </div>
    <div class="pb-bar"><div class="pb-fill" style="width:${Math.round(pub_ta/total*100)}%"></div></div>
    <div class="pb-labels"><span>0</span><span>50</span><span>100</span><span>150</span><span>200</span></div>
  </div>`;
}

// ── Supabase patch ─────────────────────────────────────────
async function patch(n, data) {
  const r = await fetch(`${SB_URL}/rest/v1/${TABLE()}?episode_number=eq.${n}`, {
    method:'PATCH', headers:{...H,'Prefer':'return=minimal'}, body:JSON.stringify(data)
  });
  if (!r.ok) throw new Error(`Supabase ${r.status}`);
}

// ── Utilities ──────────────────────────────────────────────
function showLoad(on) { document.getElementById('lb').classList.toggle('show', on); }
function showToast(msg, type='info') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3500);
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeMod(); closeImgMod(); }
});

// ── Init ───────────────────────────────────────────────────
load();
// Auto-reload removed — dashboard only refreshes when user clicks a button
</script>
