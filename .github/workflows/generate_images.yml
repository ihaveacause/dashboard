name: Generate Images (New YouTube)

on:
  workflow_dispatch:
    inputs:
      episode_number:
        description: 'Episode number'
        required: true
        type: string
      language:
        description: 'Language: ta (Tamil) or en (English)'
        required: true
        default: 'ta'
        type: choice
        options:
          - ta
          - en

jobs:
  generate-images:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-images-v2

      - name: Install dependencies
        run: pip install requests google-genai google-auth

      - name: Generate images
        env:
          SUPABASE_URL:                        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:                        ${{ secrets.SUPABASE_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          EPISODE_NUMBER:                      ${{ inputs.episode_number }}
          LANGUAGE:                            ${{ inputs.language }}
        run: python new_youtube/scripts/generate_images.py

      - name: Summary
        run: echo "✅ Images done — Episode ${{ inputs.episode_number }} (${{ inputs.language }})"
