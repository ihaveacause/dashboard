name: Generate Video (New YouTube)
on:
  workflow_dispatch:
    inputs:
      episode_number:
        description: 'Episode number'
        required: true
        type: string
      language:
        description: 'Language'
        required: true
        default: 'ta'
        type: choice
        options:
          - ta
          - en
jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ctc-v1
          restore-keys: |
            ${{ runner.os }}-pip-ctc-
      - name: Cache CTC model
        uses: actions/cache@v4
        with:
          path: ~/.cache/ctc_model
          key: ctc-aligner-model-v1
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto fonts-noto-cjk || true
          ffmpeg -version | head -1
      - name: Install Python dependencies
        run: |
          pip install ctc-forced-aligner
          pip install onnxruntime numpy librosa soundfile unidecode
          pip install google-auth cryptography Pillow requests
      - name: Generate video
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          EPISODE_NUMBER: ${{ inputs.episode_number }}
          LANGUAGE: ${{ inputs.language }}
          PYTHONUNBUFFERED: "1"
        run: python new_youtube/scripts/generate_video.py
