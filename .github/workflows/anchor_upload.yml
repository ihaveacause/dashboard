name: Anchor Upload to YouTube (On Camera)
on:
  workflow_dispatch:
    inputs:
      record_id:
        description: 'Anchor record id (uuid)'
        required: true
        type: string
      language:
        description: 'Lane: ta (Tamil) or en (English)'
        required: true
        default: 'en'
        type: choice
        options: [ta, en]
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install google-api-python-client google-auth google-auth-oauthlib supabase requests
      - name: Upload to YouTube
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_TOKEN_JSON:         ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CHANNEL_ID:         ${{ secrets.YOUTUBE_CHANNEL_ID }}
          PYTHONUNBUFFERED:           '1'
        run: python scripts/anchor_upload_to_youtube.py --record_id "${{ inputs.record_id }}" --language "${{ inputs.language }}"
