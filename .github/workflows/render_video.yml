name: Video Renderer

on:
  schedule:
    - cron: '0 */3 * * *'   # Every 3 hours — checks for published_ready stories
  workflow_dispatch:          # Manual trigger from GitHub Actions tab

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. Python setup ──────────────────────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Check if any story needs rendering (fast exit if none) ────────────
      - name: Check for publishable stories
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          pip install requests --quiet
          COUNT=$(python3 - <<'EOF'
          import os, requests
          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_KEY"]
          h   = {"apikey": key, "Authorization": f"Bearer {key}"}
          r   = requests.get(
                  f"{url}/rest/v1/content_queue",
                  headers=h,
                  params={"status": "eq.published_ready", "select": "id", "limit": "1"}
                )
          data = r.json()
          print(len(data) if isinstance(data, list) else 0)
          EOF
          )
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Stories ready to render: $COUNT"

      # ── 4. Node setup + cache (only if work to do) ───────────────────────────
      - name: Setup Node.js 20
        if: steps.check.outputs.count > 0
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Remotion browser + node_modules
        if: steps.check.outputs.count > 0
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/remotion
            ~/.cache/remotion
            video_renderer/node_modules
          key: ${{ runner.os }}-remotion-v4-${{ hashFiles('video_renderer/package.json') }}
          restore-keys: |
            ${{ runner.os }}-remotion-v4-

      # ── 5. Install dependencies ──────────────────────────────────────────────
      - name: Install Python dependencies
        if: steps.check.outputs.count > 0
        run: pip install requests edge-tts

      - name: Install Node dependencies
        if: steps.check.outputs.count > 0
        run: |
          cd video_renderer
          npm install --legacy-peer-deps

      # ── 6. System packages for fonts + Chrome ────────────────────────────────
      - name: Install system fonts + audio/video libs
        if: steps.check.outputs.count > 0
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            fonts-noto fonts-noto-color-emoji fonts-noto-extra \
            fonts-indic libgbm-dev libasound2-dev \
            ffmpeg

      # ── 7. Run the pipeline ──────────────────────────────────────────────────
      - name: Run video pipeline
        if: steps.check.outputs.count > 0
        env:
          SUPABASE_URL   : ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY   : ${{ secrets.SUPABASE_KEY }}
          PEXELS_API_KEY : ${{ secrets.PEXELS_API_KEY }}
        run: python3 video_pipeline.py

      # ── 8. Upload rendered videos as GitHub artifacts (backup) ───────────────
      - name: Archive rendered videos
        if: steps.check.outputs.count > 0
        uses: actions/upload-artifact@v4
        with:
          name: rendered-videos-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 7
          if-no-files-found: ignore
