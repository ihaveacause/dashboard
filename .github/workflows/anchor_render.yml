name: Anchor Render (On Camera YouTube Long)
on:
  workflow_dispatch:
    inputs:
      record_id:
        description: 'Anchor record id (uuid)'
        required: true
        type: string
      language:
        description: 'Lane: ta (Tamil) or en (English)'
        required: true
        default: 'en'
        type: choice
        options: [ta, en]
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-anchor-render-v3
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg --no-install-recommends || true
          ffmpeg -version | head -1
      - name: Install Python deps
        run: pip install requests Pillow google-auth cryptography
      - name: Render video
        env:
          SUPABASE_URL:                        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:                        ${{ secrets.SUPABASE_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          RECORD_ID:                           ${{ inputs.record_id }}
          LANGUAGE:                            ${{ inputs.language }}
          PYTHONUNBUFFERED:                    '1'
        run: python new_youtube/scripts/anchor_render.py
