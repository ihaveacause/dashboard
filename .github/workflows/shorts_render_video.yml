name: "[SHORTS] Render Video"

on:
  workflow_dispatch:
    inputs:
      short_id:
        description: 'Short UUID'
        required: true
        type: string
      language:
        description: 'Language: ta (Tamil) or en (English)'
        required: true
        default: 'ta'
        type: choice
        options:
          - ta
          - en

jobs:
  render-shorts-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-shorts-render-v1

      - name: Install dependencies
        run: pip install requests google-auth

      - name: Render short video
        env:
          SUPABASE_URL:                        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:                        ${{ secrets.SUPABASE_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          SHORT_ID:                            ${{ inputs.short_id }}
          LANGUAGE:                            ${{ inputs.language }}
        run: python new_youtube/scripts/shorts_render_video.py

      - name: Summary
        run: echo "✅ Short rendered — ${{ inputs.short_id }} (${{ inputs.language }})"
