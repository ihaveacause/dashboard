name: Generate Idea Scripts

on:
  workflow_dispatch:
    inputs:
      idea_id:
        description: 'Supabase idea UUID'
        required: true
        type: string

jobs:
  generate-idea-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests google-auth google-cloud-aiplatform google-generativeai supabase

      - name: Generate idea scripts
        env:
          SUPABASE_URL:    ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:    ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          IDEA_ID:         ${{ inputs.idea_id }}
        run: python scripts/generate_idea_scripts.py

      - name: Summary
        run: echo "✅ Idea ${{ inputs.idea_id }} — all scripts generated"
