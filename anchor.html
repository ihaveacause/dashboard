<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>On Camera · YouTube Long</title>
<style>
:root{
  --bg:#06070a;--surface:#0e1018;--surface2:#13151f;--surface3:#1a1d2a;
  --border:#23263a;--border2:#2e3248;--text:#e8eaf0;--muted:#7a7f9a;
  --accent:#5adca8;--accent2:#3bb88a;--red:#c83c3c;--yellow:#e0b840;
  --pip-highlight:#5adca8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;min-height:100vh}
a{color:var(--accent);text-decoration:none}
.topbar{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:100}
.back{color:var(--muted);font-size:13px}
.logo{font-size:15px;font-weight:700;letter-spacing:-.3px}
.logo em{color:var(--accent);font-style:normal}
.pill-title{background:var(--surface3);border:1px solid var(--border2);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--muted)}
.lang-toggle{margin-left:auto;display:flex;gap:6px}
.lang-btn{background:var(--surface3);border:1px solid var(--border2);color:var(--muted);padding:5px 14px;border-radius:20px;cursor:pointer;font-size:12px;transition:.15s}
.lang-btn.en,.lang-btn.ta{background:var(--accent);border-color:var(--accent);color:#06070a;font-weight:600}
.wrap{max-width:900px;margin:0 auto;padding:28px 20px}
.row-top{display:flex;align-items:flex-start;gap:16px;margin-bottom:28px}
.h1{font-size:20px;font-weight:700;margin-bottom:4px}
.sub{font-size:13px;color:var(--muted);line-height:1.5}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:.15s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#06070a}.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:var(--surface3);color:var(--text);border:1px solid var(--border2)}.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:#3a1010;color:var(--red);border:1px solid #5a2020}.btn-danger:hover{background:#4a1818}
.btn-sm{padding:5px 12px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px}
.card-title{font-size:15px;font-weight:700;margin-bottom:4px}
.card-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600}
.badge-pending{background:#1a1d2a;color:var(--muted)}
.badge-rendering{background:#1a2a1a;color:#5adca8}
.badge-rendered{background:#1a2a20;color:#3adca8}
.badge-publishing{background:#2a1a00;color:var(--yellow)}
.badge-published{background:#1a2a1a;color:#5adca8}
.badge-error{background:#2a1010;color:var(--red)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
.field input[type=text],.field input[type=number],.field textarea,.field select{
  width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;
  padding:8px 12px;color:var(--text);font-size:13px;outline:none;transition:.15s;font-family:inherit
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:80px;line-height:1.5}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;align-items:center;justify-content:center}
.overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:28px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto}
.modal h2{font-size:17px;margin-bottom:6px}
.muted{color:var(--muted);font-size:12px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .big{font-size:48px;margin-bottom:12px}
.sep{height:1px;background:var(--border);margin:16px 0}
/* image slots */
.img-slots{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.img-slot{background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:14px}
.img-slot-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.img-slot-num{background:var(--accent);color:#06070a;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.img-slot-timing{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.img-slot-timing input{width:100px;background:var(--surface3);border:1px solid var(--border2);border-radius:7px;padding:5px 8px;color:var(--text);font-size:12px;outline:none}
.img-slot-timing input:focus{border-color:var(--accent)}
.img-preview{width:60px;height:40px;object-fit:cover;border-radius:5px;border:1px solid var(--border2)}
.pip-note{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4;padding:6px 10px;background:var(--surface3);border-radius:6px;border-left:2px solid var(--accent)}
/* video preview */
video{max-width:100%;border-radius:8px;border:1px solid var(--border2);display:block}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface3);border:1px solid var(--border2);color:var(--text);padding:12px 18px;border-radius:10px;font-size:13px;z-index:500;display:none}
.bar{height:4px;background:var(--surface3);border-radius:3px;overflow:hidden;margin-top:12px}
.bar > i{display:block;height:100%;background:var(--accent);width:30%;animation:slide 1.4s infinite}
@keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}
.note{font-size:11px;color:var(--muted);margin-top:6px}
.confirm-delete{background:#1a0808;border:1px solid var(--red);border-radius:10px;padding:14px;margin-top:12px}
.confirm-delete p{color:var(--red);font-size:13px;margin-bottom:10px}
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="index.html">← Dashboard</a>
  <div class="logo">I Have A <em>Cause</em></div>
  <span class="pill-title">🎥 On Camera · YouTube Long</span>
  <div class="lang-toggle">
    <button class="lang-btn en" id="lang-en" onclick="setLang('en')">English</button>
    <button class="lang-btn" id="lang-ta" onclick="setLang('ta')">தமிழ்</button>
  </div>
</div>

<div class="wrap">
  <div class="row-top">
    <div style="flex:1">
      <div class="h1">Your recordings</div>
      <div class="sub">Upload your recording + images → enter timestamps → render → publish to YouTube.</div>
    </div>
    <button class="btn btn-primary" onclick="openUpload()">⬆ Upload Recording</button>
  </div>
  <div id="list"><div class="empty"><div class="big">🎬</div>Loading…</div></div>
</div>

<!-- Upload modal -->
<div class="overlay" id="upOverlay">
  <div class="modal">
    <h2>Upload a recording</h2>
    <div class="muted" style="margin-bottom:16px">Record yourself talking, then upload here. Add your images after uploading.</div>

    <div class="field">
      <label>Recording (mp4 / mov)</label>
      <input type="file" id="upFile" accept="video/*">
      <div class="note" id="upFileNote"></div>
    </div>
    <div class="field">
      <label>Title</label>
      <input type="text" id="upTitle" placeholder="e.g. Why freebies fail — my take">
    </div>
    <div class="field">
      <label>Module / playlist (optional)</label>
      <input type="text" id="upModule" placeholder="e.g. Politics">
    </div>

    <div class="bar" id="upBar" style="display:none"><i></i></div>
    <div style="display:flex;gap:10px;margin-top:18px">
      <button class="btn btn-ghost" onclick="closeUpload()">Cancel</button>
      <button class="btn btn-primary" id="upSubmit" onclick="submitUpload()">⬆ Upload</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Config ────────────────────────────────────────────────────
const SB_URL  = 'https://YOUR_SUPABASE_URL.supabase.co';
const SB_KEY  = 'YOUR_SUPABASE_ANON_KEY';
const H = {
  'apikey': SB_KEY,
  'Authorization': 'Bearer ' + SB_KEY,
  'Content-Type': 'application/json',
};
// Supabase JS client (for auth + realtime helpers)
const SB = window.Supabase ? window.Supabase.createClient(SB_URL, SB_KEY) : null;

let LANG = 'en';
function TABLE(){ return LANG === 'ta' ? 'tamil_anchor' : 'english_anchor'; }

function setLang(l){
  LANG = l;
  document.getElementById('lang-en').className = 'lang-btn' + (l==='en'?' en':'');
  document.getElementById('lang-ta').className = 'lang-btn' + (l==='ta'?' ta':'');
  load();
}

// ── Toast ─────────────────────────────────────────────────────
let _toastT;
function toast(msg, dur=3200){
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(_toastT);
  _toastT = setTimeout(() => el.style.display='none', dur);
}

// ── Progress bar ──────────────────────────────────────────────
function setBar(pct){
  const bar = document.getElementById('upBar');
  bar.style.display = 'block';
  const i = bar.querySelector('i');
  if(pct >= 1){ i.style.animation='none'; i.style.width='100%'; }
  else { i.style.animation=''; i.style.width='30%'; }
}

// ── Supabase helpers ──────────────────────────────────────────
async function sbGet(table, params={}){
  const q = new URLSearchParams({select:'*', order:'created_at.desc', ...params});
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${q}`, {headers:H});
  return r.ok ? r.json() : [];
}
async function sbPatch(table, id, data){
  await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${id}`, {
    method:'PATCH', headers:H, body:JSON.stringify(data)
  });
}
async function sbInsert(table, data){
  const r = await fetch(`${SB_URL}/rest/v1/${table}`, {
    method:'POST', headers:{...H, 'Prefer':'return=representation'}, body:JSON.stringify(data)
  });
  return r.ok ? r.json() : null;
}

// ── Load list ─────────────────────────────────────────────────
async function load(){
  const rows = await sbGet(TABLE());
  const el = document.getElementById('list');
  if(!rows.length){
    el.innerHTML = `<div class="empty"><div class="big">🎬</div>No recordings yet — upload one above.</div>`;
    return;
  }
  el.innerHTML = rows.map(r => renderCard(r)).join('');
}

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function statusBadge(s){
  const map = {
    pending:'badge-pending', rendering:'badge-rendering', rendered:'badge-rendered',
    publishing:'badge-publishing', published:'badge-published', error:'badge-error'
  };
  return `<span class="badge ${map[s]||'badge-pending'}">${esc(s||'pending')}</span>`;
}

function renderCard(row){
  const id = row.id;
  const images = row.image_overlays || [];
  const status = row.status || 'pending';
  const canRender = status === 'pending' || status === 'error';
  const canPublish = status === 'rendered';
  const isPublished = status === 'published';

  // Image slots display
  let imgSlotsHtml = '';
  if(images.length){
    imgSlotsHtml = `<div style="margin-top:10px">
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px">📸 ${images.length} image(s) queued</div>
      ${images.map((img,i) => `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:12px;color:var(--muted)">
          <span style="background:var(--accent);color:#06070a;border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700">${i+1}</span>
          Start: <b style="color:var(--text)">${img.start}s</b> · Duration: <b style="color:var(--text)">${img.duration}s</b>
          ${img.url ? `<img src="${esc(img.url)}" class="img-preview">` : ''}
        </div>`).join('')}
    </div>`;
  }

  // GCS delete confirmation section (only after published)
  const deleteSection = isPublished ? `
    <div class="confirm-delete">
      <p>✅ Published to YouTube. Delete all GCS files to save storage?</p>
      <div class="flow">
        <button class="btn btn-danger btn-sm" onclick="deleteGCS('${id}')">🗑 Delete GCS Files</button>
        <span class="muted" style="font-size:11px">Recording + images + render will be removed from GCS</span>
      </div>
    </div>` : '';

  return `<div class="card" id="card-${id}">
    <div class="flow" style="margin-bottom:10px">
      <div class="card-title" style="flex:1">${esc(row.title || row.working_title || 'Untitled')}</div>
      ${statusBadge(status)}
      ${row.module ? `<span class="badge badge-pending">${esc(row.module)}</span>` : ''}
    </div>
    <div class="muted" style="margin-bottom:12px">Created ${new Date(row.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>

    ${row.source_video_url ? `<video src="${esc(row.source_video_url)}" controls style="max-height:180px;margin-bottom:12px"></video>` : ''}

    ${imgSlotsHtml}

    <div class="sep"></div>

    <!-- Title field -->
    <div class="field" style="margin-bottom:10px">
      <label>Video title (for YouTube)</label>
      <input type="text" id="title_${id}" value="${esc(row.title||row.working_title||'')}" placeholder="Enter the YouTube title">
    </div>

    <!-- Image upload section -->
    <details style="margin-bottom:12px">
      <summary style="cursor:pointer;font-size:13px;color:var(--accent);font-weight:600;padding:4px 0">📸 Add / manage images</summary>
      <div style="margin-top:10px">
        <div class="pip-note">Your video plays full screen. When an image appears, your video shrinks to PiP (right-middle). Image fades out, your video returns full screen.</div>
        <div class="img-slots" id="slots-${id}">
          ${renderImageSlots(id, images)}
        </div>
        <button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="addSlot('${id}')">+ Add image</button>
      </div>
    </details>

    <!-- Action buttons -->
    <div class="flow">
      <button class="btn btn-ghost btn-sm" onclick="saveTitle('${id}')">💾 Save title</button>
      <button class="btn btn-ghost btn-sm" onclick="saveImages('${id}')">💾 Save images</button>
      ${canRender ? `<button class="btn btn-primary btn-sm" onclick="triggerRender('${id}')">🎬 Render video</button>` : ''}
      ${canPublish ? `<button class="btn btn-primary btn-sm" onclick="triggerPublish('${id}')">🚀 Publish to YouTube</button>` : ''}
      ${row.video_url ? `<a class="btn btn-ghost btn-sm" href="${esc(row.video_url)}" target="_blank">▶ Preview render</a>` : ''}
      ${row.youtube_url ? `<a class="btn btn-ghost btn-sm" href="${esc(row.youtube_url)}" target="_blank">▶ YouTube</a>` : ''}
    </div>

    ${deleteSection}
  </div>`;
}

// ── Image slots ───────────────────────────────────────────────
function renderImageSlots(cardId, images){
  if(!images.length) return '<div class="muted" style="font-size:12px;padding:8px 0">No images added yet. Click "+ Add image" below.</div>';
  return images.map((img, i) => `
    <div class="img-slot" id="slot-${cardId}-${i}">
      <div class="img-slot-header">
        <div class="img-slot-num">${i+1}</div>
        <span style="font-size:13px;color:var(--text);flex:1">${img.filename || 'Image ' + (i+1)}</span>
        ${img.url ? `<img src="${esc(img.url)}" class="img-preview">` : ''}
        <button class="btn btn-ghost btn-sm" onclick="removeSlot('${cardId}',${i})" style="padding:3px 8px;color:var(--red)">✕</button>
      </div>
      <div class="img-slot-timing">
        <label style="font-size:11px;color:var(--muted)">Start (seconds):</label>
        <input type="number" id="start-${cardId}-${i}" value="${img.start||0}" min="0" step="0.5" placeholder="e.g. 45">
        <label style="font-size:11px;color:var(--muted)">Duration (seconds):</label>
        <input type="number" id="dur-${cardId}-${i}" value="${img.duration||5}" min="1" step="0.5" placeholder="e.g. 8">
      </div>
    </div>`).join('');
}

// Pending new slots (before upload) stored per card
const _pendingSlots = {};

function addSlot(cardId){
  if(!_pendingSlots[cardId]) _pendingSlots[cardId] = [];
  // Show a file picker inline
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    toast('Uploading image…');
    try{
      const sres = await fetch(`${SB_URL}/functions/v1/anchor-upload-url`,{
        method:'POST', headers:H,
        body:JSON.stringify({filename:file.name, content_type:file.type||'image/jpeg'})
      });
      if(!sres.ok) throw new Error('upload-url ' + sres.status);
      const {session_uri, object_url} = await sres.json();
      await gcsPut(session_uri, file, ()=>{});
      // read existing images from Supabase
      const rows = await sbGet(TABLE(), {id:`eq.${cardId}`, select:'image_overlays'});
      const imgs = (rows[0]?.image_overlays) || [];
      imgs.push({url: object_url, filename: file.name, start: 0, duration: 5});
      await sbPatch(TABLE(), cardId, {image_overlays: imgs});
      toast('Image added — set timing then save');
      load();
    }catch(err){ toast('Image upload failed: ' + (err.message||err)); }
  };
  input.click();
}

function removeSlot(cardId, index){
  if(!confirm('Remove this image?')) return;
  sbGet(TABLE(), {id:`eq.${cardId}`, select:'image_overlays'}).then(rows => {
    const imgs = (rows[0]?.image_overlays) || [];
    imgs.splice(index, 1);
    sbPatch(TABLE(), cardId, {image_overlays: imgs}).then(() => { toast('Image removed'); load(); });
  });
}

async function saveImages(cardId){
  // Read timing inputs for all slots and save back
  const rows = await sbGet(TABLE(), {id:`eq.${cardId}`, select:'image_overlays'});
  const imgs = [...((rows[0]?.image_overlays) || [])];
  imgs.forEach((img, i) => {
    const startEl = document.getElementById(`start-${cardId}-${i}`);
    const durEl = document.getElementById(`dur-${cardId}-${i}`);
    if(startEl) img.start = parseFloat(startEl.value) || 0;
    if(durEl) img.duration = parseFloat(durEl.value) || 5;
  });
  await sbPatch(TABLE(), cardId, {image_overlays: imgs});
  toast('Image timings saved ✓');
}

async function saveTitle(cardId){
  const titleEl = document.getElementById('title_' + cardId);
  if(!titleEl?.value.trim()){ toast('Enter a title first'); return; }
  await sbPatch(TABLE(), cardId, {title: titleEl.value.trim()});
  toast('Title saved ✓');
}

// ── GCS upload helper ──────────────────────────────────────────
function gcsPut(sessionUri, file, onProgress){
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('PUT', sessionUri, true);
    x.setRequestHeader('Content-Type', file.type || 'video/mp4');
    x.upload.onprogress = e => { if(e.lengthComputable) onProgress(e.loaded/e.total); };
    x.onload = () => (x.status >= 200 && x.status < 300) ? res(x) : rej(new Error('GCS PUT ' + x.status));
    x.onerror = () => rej(new Error('Network error during upload'));
    x.send(file);
  });
}

// ── Trigger render via Supabase edge function ─────────────────
async function triggerRender(id){
  // First save any unsaved title
  const titleEl = document.getElementById('title_' + id);
  if(titleEl?.value.trim()){
    await sbPatch(TABLE(), id, {title: titleEl.value.trim()});
  }
  // Save timings too
  await saveImages(id);

  toast('Starting render…');
  await sbPatch(TABLE(), id, {status:'rendering'});
  try{
    const r = await fetch(`${SB_URL}/functions/v1/trigger-anchor`, {
      method:'POST', headers:H,
      body: JSON.stringify({record_id: id, language: LANG, step:'render'})
    });
    if(!r.ok) throw new Error('trigger ' + r.status + ': ' + await r.text());
    toast('Render started — check back in ~2 min');
    setTimeout(load, 2000);
  }catch(err){
    await sbPatch(TABLE(), id, {status:'error'});
    toast('Render trigger failed: ' + err.message);
  }
}

// ── Trigger publish ───────────────────────────────────────────
async function triggerPublish(id){
  if(!confirm('Publish this video to YouTube?')) return;
  toast('Starting upload to YouTube…');
  await sbPatch(TABLE(), id, {status:'publishing'});
  try{
    const r = await fetch(`${SB_URL}/functions/v1/trigger-anchor`, {
      method:'POST', headers:H,
      body: JSON.stringify({record_id: id, language: LANG, step:'upload'})
    });
    if(!r.ok) throw new Error('trigger ' + r.status + ': ' + await r.text());
    toast('YouTube upload started — refresh in a few minutes');
    setTimeout(load, 3000);
  }catch(err){
    await sbPatch(TABLE(), id, {status:'rendered'});
    toast('Publish trigger failed: ' + err.message);
  }
}

// ── GCS delete (post your confirmation, after published) ──────
async function deleteGCS(id){
  if(!confirm('This will permanently delete all GCS files (recording, images, render) for this video. The YouTube video stays. Continue?')) return;
  toast('Deleting GCS files…');
  try{
    const r = await fetch(`${SB_URL}/functions/v1/trigger-anchor`, {
      method:'POST', headers:H,
      body: JSON.stringify({record_id: id, language: LANG, step:'delete_gcs'})
    });
    if(!r.ok) throw new Error('delete ' + r.status + ': ' + await r.text());
    toast('GCS files deleted — storage freed ✓');
    await sbPatch(TABLE(), id, {source_video_url: null, video_url: null, gcs_deleted: true});
    setTimeout(load, 1500);
  }catch(err){
    toast('GCS delete failed: ' + err.message);
  }
}

// ── Upload recording modal ────────────────────────────────────
function openUpload(){ document.getElementById('upOverlay').classList.add('show'); }
function closeUpload(){ document.getElementById('upOverlay').classList.remove('show'); }

document.getElementById('upFile').addEventListener('change', e => {
  const f = e.target.files[0];
  document.getElementById('upFileNote').textContent = f ? `${(f.size/1048576).toFixed(1)} MB — ${f.name}` : '';
});

async function submitUpload(){
  const file = document.getElementById('upFile').files[0];
  const wtitle = document.getElementById('upTitle').value.trim();
  const module = document.getElementById('upModule').value.trim();
  if(!file){ toast('Choose a video file'); return; }
  if(!wtitle){ toast('Add a title'); return; }

  const btn = document.getElementById('upSubmit'); btn.disabled = true; setBar(0);
  try{
    // 1) mint GCS resumable upload session
    const sres = await fetch(`${SB_URL}/functions/v1/anchor-upload-url`,{
      method:'POST', headers:H,
      body: JSON.stringify({filename:file.name, content_type:file.type||'video/mp4'})
    });
    if(!sres.ok) throw new Error('upload-url ' + sres.status + ': ' + await sres.text());
    const {session_uri, object_url, gcs_path} = await sres.json();

    // 2) upload bytes to GCS
    try{
      await gcsPut(session_uri, file, setBar);
    }catch(putErr){
      toast('Upload response blocked — verifying…');
      const vres = await fetch(`${SB_URL}/functions/v1/anchor-upload-url`,{
        method:'POST', headers:H,
        body:JSON.stringify({action:'verify', gcs_path})
      });
      const v = vres.ok ? await vres.json() : {exists:false};
      if(!(v.exists && Number(v.size) === file.size)) throw putErr;
    }

    // 3) create the Supabase record
    await sbInsert(TABLE(), {
      working_title: wtitle,
      title: wtitle,
      source_video_url: object_url,
      module: module || null,
      image_overlays: [],
      status: 'pending'
    });

    toast('Uploaded — now add your images and set timestamps');
    closeUpload();
    document.getElementById('upFile').value = '';
    document.getElementById('upTitle').value = '';
    document.getElementById('upModule').value = '';
    load();
  }catch(err){ toast('Upload failed: ' + (err.message||err)); }
  finally{
    btn.disabled = false;
    const bar = document.getElementById('upBar');
    bar.style.display = 'none';
    bar.querySelector('i').style.width = '30%';
  }
}

load();
</script>
</body>
</html>
