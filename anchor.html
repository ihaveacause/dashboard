<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>On Camera — I Have a Cause</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#080a0f;--surface:#0f1218;--surface2:#161b24;--surface3:#1c2230;
  --border:#1e2535;--border2:#252d40;--text:#dde3f0;--muted:#5a6480;--muted2:#8892aa;
  --accent:#e8412a;--accent2:#ff6b4a;--ta:#f59e0b;--en:#3b82f6;
  --green:#10b981;--teal:#14b8a6;--purple:#8b5cf6;--red:#ef4444;--yt:#ff3333;--stats:#22d3ee;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{display:flex;align-items:center;padding:0 28px;height:56px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:300;gap:20px}
.logo{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
.logo em{color:var(--accent);font-style:normal}
.back{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:var(--muted2);text-decoration:none;padding:7px 12px;border:1px solid var(--border2);border-radius:8px}
.back:hover{color:var(--text)}
.pill-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--yt)}
.lang-toggle{display:flex;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:3px;gap:3px;margin-left:auto}
.lang-btn{padding:5px 16px;border-radius:7px;border:none;background:transparent;color:var(--muted2);font-family:'Syne',sans-serif;font-size:12px;font-weight:600;cursor:pointer}
.lang-btn.en{background:var(--en);color:#fff}.lang-btn.ta{background:var(--ta);color:#000}
.wrap{max-width:1100px;margin:0 auto;padding:26px 28px 80px}
.row-top{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.h1{font-family:'Syne',sans-serif;font-size:22px;font-weight:800}
.sub{color:var(--muted2);font-size:13px;margin-top:3px}
.btn{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;border:none;border-radius:9px;padding:10px 16px;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border2)}
.btn-ghost:hover{border-color:var(--muted)}
.btn-go{background:var(--green);color:#04210f}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.card-head{display:flex;align-items:flex-start;gap:14px}
.card-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;flex:1}
.muted{color:var(--muted2);font-size:12px}
.badge{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:4px 9px;border-radius:6px;white-space:nowrap}
.b-pending{background:rgba(90,100,128,.15);color:var(--muted2)}
.b-work{background:rgba(245,158,11,.15);color:var(--ta)}
.b-ready{background:rgba(34,211,238,.13);color:var(--stats)}
.b-done{background:rgba(16,185,129,.15);color:var(--green)}
.b-pub{background:rgba(255,51,51,.13);color:var(--yt)}
.flow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.step-dot{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}
.titles{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.title-opt{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--border2);border-radius:9px;padding:10px 12px;cursor:pointer}
.title-opt:hover{border-color:var(--accent2)}
.title-opt .sty{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--surface3);color:var(--muted2)}
.title-opt .sty.punchy{color:var(--accent2)}.title-opt .sty.descriptive{color:var(--teal)}
.beat{display:flex;gap:10px;align-items:flex-start;background:var(--surface2);border:1px solid var(--border2);border-radius:9px;padding:10px 12px;margin-top:8px}
.beat .ord{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);min-width:22px;padding-top:8px}
.beat input.hl{flex:1;background:var(--surface3);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-family:'Inter';font-size:13px;padding:7px 9px}
.mode-toggle{display:flex;border:1px solid var(--border2);border-radius:7px;overflow:hidden}
.mode-toggle button{border:none;background:var(--surface3);color:var(--muted2);font-size:11px;font-weight:600;padding:7px 10px;cursor:pointer}
.mode-toggle button.on{background:var(--purple);color:#fff}
input,select,textarea{font-family:'Inter',sans-serif}
.field{margin-top:14px}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted2);margin-bottom:6px;font-family:'JetBrains Mono',monospace}
.field input,.field select,.field textarea{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:9px;color:var(--text);font-size:13px;padding:10px 12px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.seg{display:flex;gap:8px}
.seg label{flex:1;display:flex;gap:8px;align-items:flex-start;background:var(--surface2);border:1px solid var(--border2);border-radius:9px;padding:10px;cursor:pointer;font-size:12px;text-transform:none;letter-spacing:0;color:var(--text)}
.seg label.sel{border-color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;z-index:400;padding:40px 16px;overflow:auto}
.overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:16px;width:100%;max-width:560px;padding:22px 24px}
.modal h2{font-family:'Syne',sans-serif;font-size:18px;margin-bottom:4px}
.empty{text-align:center;color:var(--muted);padding:70px 0}
.empty .big{font-size:40px;margin-bottom:10px}
.vlink{color:var(--stats);font-size:12px;text-decoration:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface3);border:1px solid var(--border2);color:var(--text);padding:12px 18px;border-radius:10px;font-size:13px;z-index:500;display:none}
.bar{height:4px;background:var(--surface3);border-radius:3px;overflow:hidden;margin-top:12px}
.bar > i{display:block;height:100%;background:var(--accent);width:30%;animation:slide 1.4s infinite}
@keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}
.note{font-size:11px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="index.html">← Dashboard</a>
  <div class="logo">I Have A <em>Cause</em></div>
  <span class="pill-title">🎥 On Camera · Studio Desk</span>
  <div class="lang-toggle">
    <button class="lang-btn en" id="lang-en" onclick="setLang('en')">English</button>
    <button class="lang-btn" id="lang-ta" onclick="setLang('ta')">தமிழ்</button>
  </div>
</div>

<div class="wrap">
  <div class="row-top">
    <div style="flex:1">
      <div class="h1">Your recordings</div>
      <div class="sub">Record yourself talking → we transcribe, suggest titles, plan studio graphics, and composite the video.</div>
    </div>
    <button class="btn btn-primary" onclick="openUpload()">⬆ Upload Recording</button>
  </div>
  <div id="list"><div class="empty"><div class="big">🎬</div>Loading…</div></div>
</div>

<!-- Upload modal -->
<div class="overlay" id="upOverlay">
  <div class="modal">
    <h2>Upload a recording</h2>
    <div class="muted">Short natural-room clips work great for testing — no green screen needed.</div>

    <div class="field">
      <label>Recording (mp4 / mov)</label>
      <input type="file" id="upFile" accept="video/*">
      <div class="note" id="upFileNote"></div>
    </div>
    <div class="field">
      <label>Working title (your label)</label>
      <input type="text" id="upTitle" placeholder="e.g. Freebies vs welfare — my take">
    </div>
    <div class="field">
      <label>Module / playlist (optional)</label>
      <input type="text" id="upModule" placeholder="e.g. Tamil Nadu Politics">
    </div>
    <div class="field">
      <label>How did you speak?</label>
      <div class="seg" id="segMode">
        <label class="sel"><input type="radio" name="smode" value="free" checked> <span><b>Freely</b><br><span class="muted">I just talked — transcribe what I said</span></span></label>
        <label><input type="radio" name="smode" value="script"> <span><b>Read a script</b><br><span class="muted">I read text aloud (paste it below)</span></span></label>
      </div>
    </div>
    <div class="field" id="scriptField" style="display:none">
      <label>Script you read</label>
      <textarea id="upScript" rows="4" placeholder="Paste the exact words you read aloud…"></textarea>
    </div>
    <div class="field">
      <label>Studio mode</label>
      <div class="seg" id="segStudio">
        <label class="sel"><input type="radio" name="studio" value="real_room" checked> <span><b>Real room</b><br><span class="muted">No green screen — graphics in a side panel</span></span></label>
        <label><input type="radio" name="studio" value="green"> <span><b>Green screen</b><br><span class="muted">Key me out, image fills behind</span></span></label>
      </div>
    </div>
    <div class="flow" style="justify-content:flex-end;margin-top:20px">
      <button class="btn btn-ghost" onclick="closeUpload()">Cancel</button>
      <button class="btn btn-primary" id="upSubmit" onclick="submitUpload()">Upload &amp; create</button>
    </div>
    <div class="bar" id="upBar" style="display:none"><i></i></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL = 'https://alfuvzlmatfkgdrkeqgk.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsZnV2emxtYXRma2dkcmtlcWdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5OTkzOTQsImV4cCI6MjA5MzU3NTM5NH0.JtxVTVdjR3vPWooM41xM1MCvJNH7WDnFjzfowjuDiRg';
const SB = window.supabase.createClient(SB_URL, SB_KEY);
const H  = {apikey:SB_KEY, Authorization:`Bearer ${SB_KEY}`, 'Content-Type':'application/json'};

let lang = 'en';
const TABLE = () => lang === 'ta' ? 'tamil_anchor' : 'english_anchor';

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3200);}

function setLang(l){
  lang=l;
  document.getElementById('lang-en').className=`lang-btn${l==='en'?' en':''}`;
  document.getElementById('lang-ta').className=`lang-btn${l==='ta'?' ta':''}`;
  load();
}

// trigger a pipeline step through the single edge function
async function callAnchor(step, id){
  const r = await fetch(`${SB_URL}/functions/v1/trigger-anchor`, {
    method:'POST', headers:H,
    body: JSON.stringify({ step, record_id:id, language:lang })
  });
  if(!r.ok){ const t=await r.text(); throw new Error(`trigger-anchor ${r.status}: ${t}`); }
  return r.json();
}

async function patch(id, data){
  const r = await fetch(`${SB_URL}/rest/v1/${TABLE()}?id=eq.${id}`, {
    method:'PATCH', headers:{...H, Prefer:'return=minimal'}, body:JSON.stringify(data)
  });
  if(!r.ok) throw new Error(`patch ${r.status}`);
}

const STATUS = {
  pending:['Pending','b-pending'], transcribing:['Transcribing…','b-work'],
  transcribed:['Pick a title','b-ready'], generating_beats:['Planning beats…','b-work'],
  beats_ready:['Review beats','b-ready'], rendering:['Rendering…','b-work'],
  rendered:['Rendered','b-done'], publishing:['Publishing…','b-work'], published:['Published','b-pub'],
};

async function load(){
  const list=document.getElementById('list');
  list.innerHTML='<div class="empty"><div class="big">🎬</div>Loading…</div>';
  try{
    const r=await fetch(`${SB_URL}/rest/v1/${TABLE()}?select=*&order=created_at.desc&limit=100`,{headers:H});
    const rows=await r.json();
    if(!rows.length){ list.innerHTML='<div class="empty"><div class="big">🎥</div>No recordings yet. Upload one to begin.</div>'; return; }
    list.innerHTML=rows.map(card).join('');
  }catch(e){ list.innerHTML=`<div class="empty">⚠️ ${e.message}</div>`; }
}

function card(row){
  const [lbl,cls]=STATUS[row.status]||['—','b-pending'];
  const name = row.title || row.working_title || '(untitled)';
  let body='';

  if(row.status==='pending'){
    body=`<div class="flow"><span class="step-dot">1 ·</span>
      <button class="btn btn-go btn-sm" onclick="run('transcribe','${row.id}')">Transcribe + suggest titles</button></div>`;
  }
  else if(row.status==='transcribing'||row.status==='generating_beats'||row.status==='rendering'||row.status==='publishing'){
    body=`<div class="bar"><i></i></div><div class="note">Running on GitHub Actions — refresh in a minute.</div>`;
  }
  else if(row.status==='transcribed'){
    const opts=(row.title_suggestions||[]).map(t=>`
      <div class="title-opt" onclick="pickTitle('${row.id}', this)" data-title="${esc(t.text)}">
        <span class="sty ${t.style}">${t.style||'punchy'}</span>
        <span style="flex:1">${esc(t.text)}</span></div>`).join('');
    body=`<div class="titles">${opts||'<div class="muted">No suggestions parsed — type your own below.</div>'}
      <div class="flow">
        <input class="beat hl" id="man_${row.id}" placeholder="…or type your own title" style="flex:1;min-width:200px">
        <button class="btn btn-ghost btn-sm" onclick="useManual('${row.id}')">Use this</button>
        <button class="btn btn-ghost btn-sm" onclick="run('transcribe','${row.id}')">↻ Regenerate</button>
      </div></div>`;
  }
  else if(row.status==='beats_ready'){
    const beats=(row.beats||[]).map(b=>beatRow(row.id,b)).join('');
    body=`<div class="muted" style="margin-top:12px">Toggle image/text or edit a headline, then render.</div>
      ${beats}
      <div class="flow" style="margin-top:12px">
        <button class="btn btn-ghost btn-sm" onclick="saveBeats('${row.id}')">💾 Save edits</button>
        <span class="step-dot">3 ·</span>
        <button class="btn btn-go btn-sm" onclick="run('render','${row.id}')">Render studio video</button>
      </div>`;
  }
  else if(row.status==='rendered'){
    body=`<div class="flow">
      ${row.video_url?`<a class="vlink" href="${row.video_url}" target="_blank">▶ Preview render</a>`:''}
      <span class="step-dot" style="margin-left:auto">4 ·</span>
      <button class="btn btn-go btn-sm" onclick="run('upload','${row.id}')">Publish to YouTube</button></div>`;
  }
  else if(row.status==='published'){
    body=`<div class="flow">${row.youtube_url?`<a class="vlink" href="${row.youtube_url}" target="_blank">▶ View on YouTube</a>`:''}
      ${row.scheduled_at?`<span class="muted" style="margin-left:auto">scheduled ${new Date(row.scheduled_at).toLocaleString()}</span>`:''}</div>`;
  }

  const meta=[row.source_mode==='script'?'read script':'free speak',
              row.studio_mode==='green'?'green':'real room',
              row.detected_lang?('lang '+row.detected_lang):null].filter(Boolean).join(' · ');
  return `<div class="card">
    <div class="card-head">
      <div class="card-title">${esc(name)}<div class="muted" style="font-weight:400;margin-top:3px">${meta}</div></div>
      <span class="badge ${cls}">${lbl}</span>
    </div>${body}</div>`;
}

function beatRow(id,b){
  const img=b.mode==='image', txt=b.mode==='text';
  return `<div class="beat" data-bid="${b.order}">
    <div class="ord">${b.order}</div>
    <input class="hl" value="${esc(b.headline||'')}" data-bh="${b.order}">
    <div class="mode-toggle">
      <button class="${img?'on':''}" onclick="setMode('${id}',${b.order},'image',this)">image</button>
      <button class="${txt?'on':''}" onclick="setMode('${id}',${b.order},'text',this)">text</button>
    </div></div>`;
}

// ── per-record actions ───────────────────────────────────────
const _cache={};   // id -> row beats during edit
async function run(step,id){
  try{ await callAnchor(step,id); toast(`Started: ${step}`); setTimeout(load,1200); }
  catch(e){ toast(e.message); }
}
async function pickTitle(id,el){
  try{ await patch(id,{title:el.dataset.title}); toast('Title set — planning beats…'); await callAnchor('beats',id); setTimeout(load,1200);}
  catch(e){ toast(e.message); }
}
async function useManual(id){
  const v=document.getElementById('man_'+id).value.trim();
  if(!v){ toast('Type a title first'); return; }
  try{ await patch(id,{title:v}); toast('Title set — planning beats…'); await callAnchor('beats',id); setTimeout(load,1200);}
  catch(e){ toast(e.message); }
}
function setMode(id,order,mode,btn){
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  btn.closest('.beat').dataset.mode=mode;
}
async function saveBeats(id){
  // read current row, apply headline + mode edits, patch back
  const r=await fetch(`${SB_URL}/rest/v1/${TABLE()}?id=eq.${id}&select=beats`,{headers:H});
  const [row]=await r.json(); const beats=row.beats||[];
  document.querySelectorAll(`.beat`).forEach(el=>{
    const ord=+el.dataset.bid; const b=beats.find(x=>x.order===ord); if(!b) return;
    const hi=el.querySelector(`[data-bh="${ord}"]`); if(hi) b.headline=hi.value;
    if(el.dataset.mode) b.mode=el.dataset.mode;
  });
  try{ await patch(id,{beats}); toast('Beat edits saved'); }catch(e){ toast(e.message); }
}

// ── upload modal ─────────────────────────────────────────────
function openUpload(){ document.getElementById('upOverlay').classList.add('show'); }
function closeUpload(){ document.getElementById('upOverlay').classList.remove('show'); }
document.getElementById('segMode').addEventListener('change',e=>{
  document.querySelectorAll('#segMode label').forEach(l=>l.classList.remove('sel'));
  e.target.closest('label').classList.add('sel');
  document.getElementById('scriptField').style.display = e.target.value==='script'?'block':'none';
});
document.getElementById('segStudio').addEventListener('change',e=>{
  document.querySelectorAll('#segStudio label').forEach(l=>l.classList.remove('sel'));
  e.target.closest('label').classList.add('sel');
});
document.getElementById('upFile').addEventListener('change',e=>{
  const f=e.target.files[0];
  document.getElementById('upFileNote').textContent = f? `${(f.size/1048576).toFixed(1)} MB — ${f.name}` : '';
});

// PUT the file straight to the GCS resumable session URI, reporting progress.
function gcsPut(sessionUri, file, onProgress){
  return new Promise((res,rej)=>{
    const x=new XMLHttpRequest();
    x.open('PUT', sessionUri, true);
    x.setRequestHeader('Content-Type', file.type||'video/mp4');
    x.upload.onprogress=e=>{ if(e.lengthComputable) onProgress(e.loaded/e.total); };
    x.onload=()=> (x.status>=200&&x.status<300) ? res() : rej(new Error('GCS PUT '+x.status));
    x.onerror=()=> rej(new Error('network error during upload'));
    x.send(file);
  });
}
function setBar(p){
  const bar=document.getElementById('upBar'); bar.style.display='block';
  const i=bar.querySelector('i'); i.style.animation='none'; i.style.marginLeft='0';
  i.style.width=Math.max(3,Math.round(p*100))+'%';
}

async function submitUpload(){
  const file=document.getElementById('upFile').files[0];
  const wtitle=document.getElementById('upTitle').value.trim();
  if(!file){ toast('Choose a video file'); return; }
  if(!wtitle){ toast('Add a working title'); return; }
  const smode=document.querySelector('input[name="smode"]:checked').value;
  const studio=document.querySelector('input[name="studio"]:checked').value;
  const script=document.getElementById('upScript').value.trim();
  const module=document.getElementById('upModule').value.trim();

  const btn=document.getElementById('upSubmit'); btn.disabled=true; setBar(0);
  try{
    // 1) mint a one-shot GCS resumable upload session (key stays server-side)
    const sres=await fetch(`${SB_URL}/functions/v1/anchor-upload-url`,{
      method:'POST', headers:H,
      body:JSON.stringify({filename:file.name, content_type:file.type||'video/mp4'})
    });
    if(!sres.ok){ throw new Error('upload-url '+sres.status+': '+(await sres.text())); }
    const {session_uri, object_url}=await sres.json();

    // 2) upload the bytes straight to GCS
    await gcsPut(session_uri, file, setBar);

    // 3) create the record pointing at the GCS object
    const {error:insErr}=await SB.from(TABLE()).insert({
      working_title:wtitle, source_video_url:object_url,
      source_mode:smode, script_text:smode==='script'?script:null,
      studio_mode:studio, module:module||null, status:'pending'
    });
    if(insErr) throw insErr;

    toast('Uploaded to GCS — ready to transcribe');
    closeUpload();
    document.getElementById('upFile').value=''; document.getElementById('upTitle').value='';
    document.getElementById('upScript').value=''; document.getElementById('upModule').value='';
    load();
  }catch(e){ toast('Upload failed: '+(e.message||e)); }
  finally{ btn.disabled=false; const bar=document.getElementById('upBar'); bar.style.display='none'; bar.querySelector('i').style.width='30%'; }
}

function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

load();
</script>
</body>
</html>
