<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shorts — I Have a Cause</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#080a0f;--surface:#0f1218;--surface2:#161b24;--surface3:#1c2230;
  --border:#1e2535;--border2:#252d40;--text:#dde3f0;--muted:#5a6480;--muted2:#8892aa;
  --accent:#e8412a;--accent2:#ff6b4a;--ta:#f59e0b;--en:#3b82f6;
  --green:#10b981;--teal:#14b8a6;--purple:#8b5cf6;--red:#ef4444;--yt:#ff3333;--stats:#22d3ee;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{display:flex;align-items:center;padding:0 28px;height:56px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:300;gap:20px}
.logo{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
.logo em{color:var(--accent);font-style:normal}
.back{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:var(--muted2);text-decoration:none;padding:7px 12px;border:1px solid var(--border2);border-radius:8px}
.back:hover{color:var(--text)}
.pill-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--accent2)}
.lang-toggle{display:flex;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:3px;gap:3px;margin-left:auto}
.lang-btn{padding:5px 16px;border-radius:7px;border:none;background:transparent;color:var(--muted2);font-family:'Syne',sans-serif;font-size:12px;font-weight:600;cursor:pointer}
.lang-btn.en{background:var(--en);color:#fff}.lang-btn.ta{background:var(--ta);color:#000}
.wrap{max-width:1100px;margin:0 auto;padding:26px 28px 80px}
.row-top{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.h1{font-family:'Syne',sans-serif;font-size:22px;font-weight:800}
.sub{color:var(--muted2);font-size:13px;margin-top:3px}
.btn{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;border:none;border-radius:9px;padding:10px 16px;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border2)}
.btn-ghost:hover{border-color:var(--muted)}
.btn-go{background:var(--green);color:#04210f}
.btn-approve{background:var(--stats);color:#042733}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ep-group{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.ep-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:6px}
.ep-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;flex:1}
.ep-num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-right:6px}
.ep-sub{color:var(--muted2);font-size:12px;margin-top:2px}
.short-card{background:var(--surface2);border:1px solid var(--border2);border-radius:11px;padding:14px 16px;margin-top:12px}
.short-head{display:flex;align-items:flex-start;gap:10px}
.short-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;flex:1}
.muted{color:var(--muted2);font-size:12px}
.badge{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:4px 9px;border-radius:6px;white-space:nowrap}
.b-pending{background:rgba(90,100,128,.15);color:var(--muted2)}
.b-work{background:rgba(245,158,11,.15);color:var(--ta)}
.b-ready{background:rgba(34,211,238,.13);color:var(--stats)}
.b-done{background:rgba(16,185,129,.15);color:var(--green)}
.b-pub{background:rgba(255,51,51,.13);color:var(--yt)}
.flow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.hook-box{background:var(--surface3);border:1px solid var(--border2);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:13px;line-height:1.5}
.hook-box .lbl{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted2);margin-bottom:4px}
.imgs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.imgs img{width:64px;height:114px;object-fit:cover;border-radius:6px;border:1px solid var(--border2)}
.empty{text-align:center;color:var(--muted);padding:70px 0}
.empty .big{font-size:40px;margin-bottom:10px}
.vlink{color:var(--stats);font-size:12px;text-decoration:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface3);border:1px solid var(--border2);color:var(--text);padding:12px 18px;border-radius:10px;font-size:13px;z-index:500;display:none}
.bar{height:4px;background:var(--surface3);border-radius:3px;overflow:hidden;margin-top:10px}
.bar > i{display:block;height:100%;background:var(--accent);width:30%;animation:slide 1.4s infinite}
@keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}
.note{font-size:11px;color:var(--muted);margin-top:6px}
.gen-row{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--border2)}
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="index.html">← Dashboard</a>
  <div class="logo">I Have A <em>Cause</em></div>
  <span class="pill-title">🎬 Shorts</span>
  <div class="lang-toggle">
    <button class="lang-btn en" id="lang-en" onclick="setLang('en')">English</button>
    <button class="lang-btn" id="lang-ta" onclick="setLang('ta')">தமிழ்</button>
  </div>
</div>

<div class="wrap">
  <div class="row-top">
    <div style="flex:1">
      <div class="h1">Shorts — one per provocative moment</div>
      <div class="sub">1–3 self-sufficient Shorts per episode, cut from the approved long script by Gemini, styled to match the long version, each ending on a hook back to the full video.</div>
    </div>
  </div>
  <div id="list"><div class="empty"><div class="big">🎬</div>Loading…</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL = 'https://alfuvzlmatfkgdrkeqgk.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsZnV2emxtYXRma2dkcmtlcWdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5OTkzOTQsImV4cCI6MjA5MzU3NTM5NH0.JtxVTVdjR3vPWooM41xM1MCvJNH7WDnFjzfowjuDiRg';
const H = {apikey:SB_KEY, Authorization:`Bearer ${SB_KEY}`, 'Content-Type':'application/json'};

let lang = 'en';
const EP_TABLE     = () => lang === 'ta' ? 'tamil_episodes' : 'english_episodes';
const SHORTS_TABLE = () => lang === 'ta' ? 'tamil_shorts'   : 'english_shorts';
const TITLE_COL    = () => lang === 'ta' ? 'title_tamil'    : 'title_english';

// episodes whose long script has been approved (or further along) — shorts can be pulled from these
const APPROVED_STATUSES = ['script_approved','images_ready','images_approved','voice_uploaded','voice_approved','video_ready','video_approved','published'];

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3200);}

function setLang(l){
  lang=l;
  document.getElementById('lang-en').className=`lang-btn${l==='en'?' en':''}`;
  document.getElementById('lang-ta').className=`lang-btn${l==='ta'?' ta':''}`;
  load();
}

async function callShorts(step, payload){
  const r = await fetch(`${SB_URL}/functions/v1/trigger-shorts`, {
    method:'POST', headers:H,
    body: JSON.stringify({ step, language:lang, ...payload })
  });
  if(!r.ok){ const t=await r.text(); throw new Error(`trigger-shorts ${r.status}: ${t}`); }
  return r.json();
}

async function patchShort(id, data){
  const r = await fetch(`${SB_URL}/rest/v1/${SHORTS_TABLE()}?id=eq.${id}`, {
    method:'PATCH', headers:{...H, Prefer:'return=minimal'}, body:JSON.stringify(data)
  });
  if(!r.ok) throw new Error(`patch ${r.status}`);
}

const STATUS = {
  script_ready:      ['Review script','b-ready'],
  script_approved:    ['Script approved','b-done'],
  generating_images:  ['Generating images…','b-work'],
  images_ready:       ['Review images','b-ready'],
  images_approved:    ['Images approved','b-done'],
  rendering:          ['Rendering…','b-work'],
  video_ready:        ['Review video','b-ready'],
  publishing:         ['Publishing…','b-work'],
  published:          ['Published','b-pub'],
};

async function load(){
  const list=document.getElementById('list');
  list.innerHTML='<div class="empty"><div class="big">🎬</div>Loading…</div>';
  try{
    const epR = await fetch(`${SB_URL}/rest/v1/${EP_TABLE()}?select=episode_number,${TITLE_COL()},module,status&order=episode_number.asc&limit=300`,{headers:H});
    const episodes = (await epR.json()).filter(e => APPROVED_STATUSES.includes(e.status));

    const shR = await fetch(`${SB_URL}/rest/v1/${SHORTS_TABLE()}?select=*&order=short_index.asc&limit=1000`,{headers:H});
    const shorts = await shR.json();

    if(!episodes.length){
      list.innerHTML = '<div class="empty"><div class="big">📄</div>No episodes with an approved script yet.<br>Approve a long-form script in Series first — Shorts are cut from it.</div>';
      return;
    }

    const byEp = {};
    shorts.forEach(s => { (byEp[s.episode_number] = byEp[s.episode_number]||[]).push(s); });

    list.innerHTML = episodes.map(ep => epGroup(ep, byEp[ep.episode_number]||[])).join('');
  }catch(e){ list.innerHTML = `<div class="empty">⚠️ ${e.message}</div>`; }
}

function epGroup(ep, shorts){
  const title = ep[TITLE_COL()] || `Episode ${ep.episode_number}`;
  const cards = shorts.map(shortCard).join('');
  const genRow = shorts.length
    ? `<div class="gen-row"><span class="muted">${shorts.length} short${shorts.length>1?'s':''} for this episode</span>
        <button class="btn btn-ghost btn-sm" onclick="genScripts(${ep.episode_number})">↻ Regenerate shorts</button></div>`
    : `<div class="gen-row"><span class="muted">No shorts yet — Gemini will decide 1 to 3 based on this script.</span>
        <button class="btn btn-primary btn-sm" onclick="genScripts(${ep.episode_number})">⚡ Generate Shorts</button></div>`;

  return `<div class="ep-group">
    <div class="ep-head">
      <div><span class="ep-num">#${ep.episode_number}</span><span class="ep-title">${esc(title)}</span>
        ${ep.module?`<div class="ep-sub">${esc(ep.module)}</div>`:''}</div>
    </div>
    ${cards}
    ${genRow}
  </div>`;
}

function shortCard(s){
  const [lbl,cls] = STATUS[s.status] || ['—','b-pending'];
  let body = '';

  if(s.status==='script_ready'){
    body = `<div class="hook-box"><div class="lbl">Hook</div>${esc(s.hook_line||'')}</div>
      <div class="hook-box"><div class="lbl">Script</div>${esc(s.script||'')}</div>
      <div class="hook-box"><div class="lbl">Hook back to full video</div>${esc(s.cta_line||'')}</div>
      <div class="flow">
        <button class="btn btn-approve btn-sm" onclick="approve('${s.id}','script_approved')">✓ Approve Script</button>
      </div>`;
  }
  else if(s.status==='script_approved'){
    body = `<div class="flow"><button class="btn btn-go btn-sm" onclick="run('images','${s.id}')">Generate Images</button></div>`;
  }
  else if(s.status==='generating_images'||s.status==='rendering'||s.status==='publishing'){
    body = `<div class="bar"><i></i></div><div class="note">Running on GitHub Actions — refresh in a minute.</div>`;
  }
  else if(s.status==='images_ready'){
    const imgs=imgList(s.image_urls_vertical).map(i=>`<img src="${i.url}" alt="${esc(i.label||'')}">`).join('');
    body = `<div class="imgs">${imgs}</div>
      <div class="flow">
        <button class="btn btn-ghost btn-sm" onclick="run('images','${s.id}')">↻ Regenerate</button>
        <button class="btn btn-approve btn-sm" onclick="approve('${s.id}','images_approved')">✓ Approve Images</button>
      </div>`;
  }
  else if(s.status==='images_approved'){
    const imgs=imgList(s.image_urls_vertical).map(i=>`<img src="${i.url}" alt="${esc(i.label||'')}">`).join('');
    body = `<div class="imgs">${imgs}</div>
      <div class="flow"><button class="btn btn-go btn-sm" onclick="run('video','${s.id}')">Render Video</button></div>`;
  }
  else if(s.status==='video_ready'){
    body = `<div class="flow">
      ${s.video_url?`<a class="vlink" href="${s.video_url}" target="_blank">▶ Preview render</a>`:''}
      <button class="btn btn-approve btn-sm" onclick="run('upload','${s.id}')" style="margin-left:auto">✓ Approve &amp; Publish to YouTube</button></div>`;
  }
  else if(s.status==='published'){
    body = `<div class="flow">${s.youtube_url?`<a class="vlink" href="${s.youtube_url}" target="_blank">▶ View Short on YouTube</a>`:''}
      ${s.scheduled_at?`<span class="muted" style="margin-left:auto">scheduled ${new Date(s.scheduled_at).toLocaleString()}</span>`:''}</div>`;
  }

  return `<div class="short-card">
    <div class="short-head">
      <div class="short-title">Short ${s.short_index} — ${esc(s.title||'')}</div>
      <span class="badge ${cls}">${lbl}</span>
    </div>${body}</div>`;
}

async function genScripts(episodeNumber){
  try{ await callShorts('scripts', {episode_number: episodeNumber}); toast('Generating shorts — refresh in a minute'); setTimeout(load,1500); }
  catch(e){ toast(e.message); }
}
async function run(step,id){
  try{ await callShorts(step, {short_id:id}); toast(`Started: ${step}`); setTimeout(load,1200); }
  catch(e){ toast(e.message); }
}
async function approve(id, nextStatus){
  try{ await patchShort(id, {status: nextStatus}); toast('Approved'); load(); }
  catch(e){ toast(e.message); }
}

function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// Defensive: some older rows may have image_urls_vertical stored as a JSON
// string instead of a real array (pre-fix data). Handles both safely.
function imgList(v){
  if(Array.isArray(v)) return v;
  if(typeof v === 'string' && v.trim()){
    try{ const p = JSON.parse(v); return Array.isArray(p) ? p : []; }
    catch(e){ return []; }
  }
  return [];
}

load();
</script>
</body>
</html>
